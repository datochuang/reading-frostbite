mark 用 Vine 寫","src":{"t":"Frostbite 發表文","u":"https://architectlabs.com/blog/frostbite"}},{"from":"tendrils","to":"frostbite","t":2026.883,"kind":"cites","label":"引用 Tendrils 入門文","src":{"t":"Frostbite 發表文","u":"https://architectlabs.com/blog/frostbite"}},{"from":"lafont","to":"frostbite","t":2026.883,"kind":"cites","label":"引用 Lafont 1990","src":{"t":"Frostbite 發表文","u":"https://architectlabs.com/blog/frostbite"}},{"from":"frostbite","to":"tendrils_chip","t":2026.883,"kind":"competes","label":"都做 inet 處理器","src":{"t":"Frostbite 發表文","u":"https://architectlabs.com/blog/frostbite"}}],"events":[{"t":1978.5,"date":"1978","title":"Lévy 定義 optimal reduction","detail":"Lévy 定義 redex family，並把每個 family 只化簡一次稱為 optimal reduction（1978 提出，1980 成文），這是共享化簡的理論最少步數。有些 λ-term 用任何循序化簡順序都達不到這個步數，實作要到 1990 年才出現。","kind":"paper","actors":["levy"],"lane":"theory","weight":2,"conf":"verified","src":[{"t":"Asperti 2017 §2","u":"https://arxiv.org/abs/1701.04240"},{"t":"Lévy 1980","u":"https://pauillac.inria.fr/~levy/pubs/80curry.pdf"},{"t":"Δ-Nets §1","u":"https://arxiv.org/abs/2505.20314"}]},{"t":1979.5,"date":"1979","title":"Turner：combinator 圖化簡","detail":"把 applicative 語言轉成不含 bound variable 的 combinator 形式再做圖化簡，用到高階函數的程式執行得更有效率。後來的 interaction net 作者指出，S、K combinator 的一步化簡沒有已知的 constant time 保證。","kind":"paper","actors":[],"lane":"theory","weight":1,"conf":"verified","src":[{"t":"Turner 1979","u":"https://doi.org/10.1002/spe.4380090105"},{"t":"Mackie–Pinto 2002 §1","u":"https://repositorium.uminho.pt/bitstreams/f3f5ad5e-9466-4ddf-8869-14d34ea18782/download"}]},{"t":1980.5,"date":"1980","title":"Cambridge 做出 SKIM","detail":"SKIM 是 microcoded 的 combinator reduction 處理器。Stoye 在 1985 年寫道，8 MHz 68000 上的 combinator reducer 速度約為 SKIM 的三十分之一。","kind":"hardware","actors":["graphreduction"],"lane":"precursor","weight":1,"conf":"verified","src":[{"t":"Wikipedia：Graph reduction machine","u":"https://en.wikipedia.org/wiki/Graph_reduction_machine"},{"t":"Naylor & Runciman, JFP 2012","u":"https://doi.org/10.1017/S0956796812000214"}]},{"t":1983.5,"date":"1983","title":"INMOS 發表 Transputer","detail":"晶片內建 RAM 與四條 serial link，早期型號在 20 MHz 下約 10 MIPS。後繼的 T9000 取消時約 36 MIPS，沒有達到比 T800 快十倍的目標。","kind":"hardware","actors":["transputer"],"lane":"precursor","weight":1,"conf":"verified","src":[{"t":"Wikipedia：Transputer","u":"https://en.wikipedia.org/wiki/Transputer"}]},{"t":1987.5,"date":"1987","title":"Girard 發表 linear logic","detail":"證明可以畫成 proof net，cut elimination 就是圖改寫。這種改寫只在 multiplicative 片段特別規矩，而該片段能寫的程式太少，interaction net 由此出發。","kind":"paper","actors":["girard"],"lane":"theory","weight":2,"conf":"verified","src":[{"t":"Girard 1987","u":"https://doi.org/10.1016/0304-3975(87)90045-4"},{"t":"Mazza 2006 thesis","u":"https://lipn.univ-paris13.fr/~mazza/papers/Thesis-1.0.pdf"}]},{"t":1989.417,"date":"1989-06","title":"GRIP 點出粒度與 locality 問題","detail":"Peyton Jones、Clack 與 Salkild 在 PARLE 1989 指出平行 graph reduction 的兩個問題：把平行度控制在合適的粒度，以及讓常被引用的資料靠近使用它的處理器。","kind":"paper","actors":["graphreduction"],"lane":"precursor","weight":1,"conf":"verified","src":[{"t":"Microsoft Research：PARLE 1989","u":"https://www.microsoft.com/en-us/research/publication/high-performance-parallel-graph-reduction/"}]},{"t":1990.04,"date":"1990-01","title":"Lafont 發表 interaction nets","detail":"在四個限制下 one-step diamond property 成立，化簡順序不影響結果與總步數，可以安全地同時改寫：每個 agent 只有一個 principal port、rule 左側恰為一個 active pair、每對符號至多一條 rule（同一符號相遇時右側須對稱）、改寫前後介面不變。這個性質不保證終止，也不保證加速，無 deadlock 需要另加型別規範。","kind":"paper","actors":["lafont"],"lane":"theory","weight":3,"conf":"verified","src":[{"t":"Lafont 1990（POPL）","u":"https://doi.org/10.1145/96709.96718"},{"t":"Mazza 2006 thesis","u":"https://lipn.univ-paris13.fr/~mazza/papers/Thesis-1.0.pdf"},{"t":"Gimenez–Moser §2","u":"https://arxiv.org/abs/1511.01838"}]},{"t":1990.04,"date":"1990-01","title":"Lamping 的 optimal 化簡演算法","detail":"第一個做到 Lévy-optimal 共享的演算法，與 Lafont 的論文登在同一本 POPL 論文集，兩者各自獨立。維持共享範圍的 bookkeeping 很複雜，成本至今沒有被證明的上界。","kind":"paper","actors":["lamping","levy"],"lane":"theory","weight":3,"conf":"verified","src":[{"t":"Lamping 1990（POPL）","u":"https://doi.org/10.1145/96709.96711"},{"t":"Asperti 2017 §1、§3","u":"https://arxiv.org/abs/1701.04240"}]},{"t":1990.5,"date":"1990","title":"stock hardware 論點成形","detail":"Philip Koopman 在 1990 年寫道，等 graph reduction 晶片設計製造完成，RISC 的速度多半已讓這件事失去意義。Peyton Jones 1992 年的 STG machine 論文把 lazy 語言實作在 stock hardware 上，後來成為 GHC 的基礎。","kind":"critique","actors":["graphreduction"],"lane":"precursor","weight":2,"conf":"verified","src":[{"t":"Stewart 等投影片 2018","u":"https://www-users.york.ac.uk/%7Emt540/graceful-ws/slides/Stewart.pdf"},{"t":"Peyton Jones, JFP 1992","u":"https://www.cambridge.org/core/journals/journal-of-functional-programming/article/implementing-lazy-functional-languages-on-stock-hardware-the-spineless-tagless-gmachine/354FFB29102309CCD2A3824F894A2799"}]},{"t":1991.5,"date":"1991","title":"Gay 的 interaction net 語言","detail":"Gay 的學位論文替 Lafont 的 net 做出具體的語言與 interpreter，port 帶有型別與方向。複製與刪除都要用明確的 agent 寫出來，這是 linearity 的直接結果。","kind":"release","actors":["lafont"],"lane":"software","weight":1,"conf":"verified","src":[{"t":"Gay 1991","u":"https://www.dcs.gla.ac.uk/~simon/publications/diploma.pdf"}]},{"t":1992.5,"date":"1992","title":"Lamping 演算法改寫成 net","detail":"Gonthier、Abadi、Lévy 在 POPL 與 LICS 的兩篇論文用帶索引的 bracket 與 croissant 標出共享範圍，把 Lamping 的演算法寫成 interaction net 系統。後續研究指出 bracket 容易累積，造成指數級的額外工作。","kind":"paper","actors":["gal","lamping","lafont"],"lane":"theory","weight":3,"conf":"verified","src":[{"t":"POPL 1992","u":"https://doi.org/10.1145/143165.143172"},{"t":"LICS 1992","u":"https://doi.org/10.1109/LICS.1992.185535"},{"t":"Asperti 2017 §3","u":"https://arxiv.org/abs/1701.04240"}]},{"t":1992.5,"date":"1992","title":"Monsoon dataflow 機器完成","detail":"Arvind 的 MIT 團隊與 Motorola 完成 Monsoon，十餘台裝在 Los Alamos 與其他大學。機器後來退役，收藏於 Computer History Museum。","kind":"hardware","actors":["dataflow"],"lane":"precursor","weight":2,"conf":"verified","src":[{"t":"Wikipedia：Arvind","u":"https://en.wikipedia.org/wiki/Arvind_(computer_scientist)"}]},{"t":1994.5,"date":"1994","title":"Fifth Generation 計畫結束","detail":"十二年投入略低於 570 億日圓，做出五台 Parallel Inference Machine。來源的總結是高度平行的架構最後在速度上被 Sun 工作站與 Intel x86 等較不專用的硬體超越。","kind":"hardware","actors":["fifthgen"],"lane":"precursor","weight":2,"conf":"verified","src":[{"t":"Wikipedia：Fifth Generation","u":"https://en.wikipedia.org/wiki/Fifth_Generation_Computer_Systems"}]},{"t":1994.583,"date":"1994-08","title":"Thinking Machines 聲請破產保護","detail":"公司在 1990 年賣出 US$6,500 萬的軟硬體，1992 年轉為虧損。CM-5 已由自製的一位元處理器改用 SPARC；硬體部門後來由 Sun 收購。","kind":"company","actors":["connectionmachine"],"lane":"precursor","weight":2,"conf":"verified","src":[{"t":"Wikipedia：Thinking Machines","u":"https://en.wikipedia.org/wiki/Thinking_Machines_Corporation"},{"t":"Wikipedia：Connection Machine","u":"https://en.wikipedia.org/wiki/Connection_Machine"}]},{"t":1996.5,"date":"1996","title":"Lawall–Mairson 的指數下界","detail":"一族 λ-term 正常化只要 Θ(n) 時間與 Θ(n) 次 fan interaction，sharing graph 卻要 Ω(2^n) 次 bookkeeping。這是第一個 bookkeeping 下界，說明 β 步數不能當作 λ-calculus 的成本衡量。","kind":"result","actors":["mairson"],"lane":"theory","weight":2,"conf":"verified","src":[{"t":"Lawall–Mairson 1996","u":"https://doi.org/10.1145/232627.232639"}]},{"t":1996.83,"date":"1996-11","title":"BOHM：optimal reduction 原型","detail":"在作者自選的高階 benchmark 上，Caml Light 跑不完的題目 BOHM 在 5 秒內完成；沒有共享可用時約慢 10 倍，數值運算最多慢 50 倍。量測由作者在 Sparc Station 5 上進行，對照組是 bytecode 實作的 Caml Light。","kind":"release","actors":["bohm","asperti"],"lane":"software","weight":2,"conf":"self_reported","src":[{"t":"BOHM（JFP 1996）","u":"https://www.cambridge.org/core/journals/journal-of-functional-programming/article/bologna-optimal-higherorder-machine/1F2763B0F931680F9B15BDC750BEB343"}]},{"t":1997.33,"date":"1997-05","title":"Asperti–Mairson 成本下界","detail":"實作 n 個 parallel β-step（Lévy family step）的成本沒有 Kalmar-elementary 上界，任何固定高度的 2 的指數塔都不足以當上界，所以 optimal 的步數不能當成執行時間。作者表示這不代表 optimal evaluation 的終結；結果在 1997-05 公告，POPL 1998 發表，期刊版 2001。","kind":"result","actors":["asperti","mairson"],"lane":"theory","weight":3,"conf":"verified","src":[{"t":"Types-list 公告","u":"https://www.engineering.upenn.edu/~sweirich/types/archive/1997-98/msg00086.html"},{"t":"POPL 1998","u":"https://doi.org/10.1145/268946.268971"},{"t":"Asperti 2017 §2","u":"https://arxiv.org/abs/1701.04240"}]},{"t":1997.5,"date":"1997","title":"interaction combinators 發表","detail":"三種符號、六條 rule 就能翻譯任何 interaction system：每條 rule 用常數步模擬，時間、空間與平行度都保留到常數倍。代價是這個隨來源系統而變的常數，以及數值與多 port 的 agent 都得用二元 cell 組成；1995 年已有 preprint。","kind":"paper","actors":["lafont"],"lane":"theory","weight":3,"conf":"verified","src":[{"t":"Lafont 1997","u":"https://doi.org/10.1006/inco.1997.2643"},{"t":"Mazza 2006 thesis §1.4","u":"https://lipn.univ-paris13.fr/~mazza/papers/Thesis-1.0.pdf"}]},{"t":1998.5,"date":"1998","title":"YALE：放棄 optimal 換效率","detail":"Mackie 提出不求 optimal 的 interaction net λ 編碼，避開 bookkeeping 造成的低效率。論文摘要寫明：有效率的 optimal reduction 實作都得離開 interaction net 這個框架。","kind":"paper","actors":["yale","mackie"],"lane":"software","weight":2,"conf":"verified","src":[{"t":"YALE（ICFP 1998）","u":"https://doi.org/10.1145/289423.289434"}]},{"t":1999.5,"date":"1999","title":"Fernández–Mackie calculus","detail":"替 interaction net 提供文字式記法，之後成為描述化簡策略與實作的標準寫法，Salikhmetov 與 HVM2 論文所說的 interaction calculus 指的就是它。Taelin 的 Interaction Calculus 是另一套帶 superposition 的 term 語言，名稱相同、內容不同。","kind":"paper","actors":["fernandez","mackie"],"lane":"theory","weight":1,"conf":"verified","src":[{"t":"Fernández–Mackie 1999","u":"https://doi.org/10.1007/10704567_10"},{"t":"HVM2 paper §2","u":"https://raw.githubusercontent.com/HigherOrderCO/HVM/main/paper/HVM2.pdf"}]},{"t":2000.5,"date":"2000","title":"複製工作本身非 elementary","detail":"Asperti、Coppola、Martini 證明：optimal reducer 的 duplication 步數，沒有以共享 β 步數為變數的 elementary 上界。非 elementary 的成本在複製本身，換任何 bookkeeping 作法都消不掉；期刊版 2004。","kind":"result","actors":["asperti"],"lane":"theory","weight":2,"conf":"verified","src":[{"t":"Asperti–Coppola–Martini 2000","u":"https://doi.org/10.1145/325694.325707"},{"t":"Asperti 2017 §3","u":"https://arxiv.org/abs/1701.04240"}]},{"t":2001.5,"date":"2001","title":"MPINE：2 處理器平行量測","detail":"Pinto 在共享記憶體機器上以 mutex 同步，四個測試的 2 處理器執行時間是循序版的 52.7% 到 110%，其中一個變慢。對照組是沒有同步成本的循序 reducer；表格以 OCR 從論文讀出。","kind":"result","actors":["amine","pinto"],"lane":"software","weight":1,"conf":"self_reported","src":[{"t":"MPINE（RTA 2001）","u":"https://hdl.handle.net/1822/773"}]},{"t":2004.5,"date":"2004","title":"Lambdascope：另一個 optimal 實作","detail":"van Oostrom 等人提出的 optimal 實作；delimiter 會不會累積，Salvadori（2025）說會，Asperti（2017）說不會，整理時沒有找到已審查的比較可以裁定。Hackage 上的實作在 2024-03 仍有更新。","kind":"paper","actors":[],"lane":"software","weight":1,"conf":"verified","src":[{"t":"interaction-net-resources","u":"https://github.com/marvinborner/interaction-net-resources"},{"t":"Hackage：graph-rewriting-lambdascope","u":"https://hackage.haskell.org/package/graph-rewriting-lambdascope"},{"t":"Asperti 2017 §3","u":"https://arxiv.org/abs/1701.04240"}]},{"t":2004.5,"date":"2004","title":"differential nets 發表","detail":"Ehrhard 與 Regnier 替 differential lambda-calculus 設計 differential interaction nets（WoLLIC 2004，TCS 2006）。同一個 active pair 可以有多條 rule，因此得到 non-determinism，也失去 one-step diamond property。","kind":"paper","actors":["ehrhard_regnier"],"lane":"theory","weight":1,"conf":"verified","src":[{"t":"WoLLIC 2004","u":"https://doi.org/10.1016/j.entcs.2004.06.060"},{"t":"Mazza 2006 thesis","u":"https://lipn.univ-paris13.fr/~mazza/papers/Thesis-1.0.pdf"}]},{"t":2006.5,"date":"2006","title":"Mazza：multiport 與語意理論","detail":"博士論文指出一般 interaction net 的計算過程本質上唯一、無法表達衝突，並提出有多個 principal port 的擴充，表達力與 π-calculus 相當。對應的 universal 系統只對子系統證明，一般情形仍是猜想。","kind":"paper","actors":["mazza"],"lane":"theory","weight":2,"conf":"verified","src":[{"t":"Mazza 2006 thesis","u":"https://lipn.univ-paris13.fr/~mazza/papers/Thesis-1.0.pdf"},{"t":"CONCUR 2005","u":"https://doi.org/10.1007/11539452_6"}]},{"t":2007.5,"date":"2007","title":"無 oracle 演算法的正確範圍","detail":"Baillot、Coppola、Dal Lago 證明：對 Elementary 或 Light Affine Logic 可型別化的 term，不含 oracle 的 abstract algorithm sound and complete，並有 elementary 或多項式上界。範圍之外沒有這個保證，HVM2 論文自陳 Church 編碼的 2^2 無法正確化簡。","kind":"result","actors":["lamping"],"lane":"theory","weight":2,"conf":"verified","src":[{"t":"Baillot–Coppola–Dal Lago","u":"https://arxiv.org/abs/0704.2448"},{"t":"HVM2 paper §13.1","u":"https://raw.githubusercontent.com/HigherOrderCO/HVM/main/paper/HVM2.pdf"}]},{"t":2009.5,"date":"2009","title":"TRIPS 實測：Core 2 的 60%","detail":"UT Austin 在 130 nm 的實體晶片上量測，編譯過的 SPEC2000 只達 Intel Core 2 的 60%。作者寫道這個效能不支持 EDGE 處理器能勝過業界領先設計的假設，即使效能加倍，加速幅度也不足以支持改用新一類 ISA。","kind":"result","actors":["trips"],"lane":"precursor","weight":3,"conf":"verified","src":[{"t":"Gebhart 等，ASPLOS 2009","u":"https://www.cs.utexas.edu/~skeckler/pubs/asplos09.pdf"}]},{"t":2010.5,"date":"2010-07","title":"amineLight 輕量 machine","detail":"Hassan、Mackie、Sato 簡化 2008 年 Pin 編譯器所用的 abstract machine，作者稱實作比當時其他 interaction net evaluator 明顯更有效率。他們據此主張 interaction net 可以當編譯器的中介語言。","kind":"release","actors":["pin","sato","mackie"],"lane":"software","weight":1,"conf":"self_reported","src":[{"t":"ECEASST 29（2010）","u":"http://eceasst.org/index.php/eceasst/article/view/1674"},{"t":"Hassan–Mackie–Sato 2008","u":"https://www.user.tu-berlin.de/o.runge/tfs/workshops/gtvmt08/Program/paper_38.pdf"}]},{"t":2012.527,"date":"2012-07-10","title":"Reduceron：比 PC 慢 4–5 倍","detail":"96 MHz 的 FPGA 實作平均比 3 GHz Core 2 Duo 上的 GHC 慢 4–5 倍；作者推估它比同一顆 FPGA 上 RISC soft core 跑傳統編譯程式快 5–10 倍，實測的對照是自家 compiler，為 10–20 倍。作者寫道新的 GHC 最佳化與更快的 PC 明顯拉高了 PC 這一邊的成績。","kind":"result","actors":["reduceron"],"lane":"precursor","weight":3,"conf":"verified","src":[{"t":"Naylor & Runciman, JFP 2012","u":"https://doi.org/10.1017/S0956796812000214"}]},{"t":2014.253,"date":"2014-04-01","title":"ingpu：GPU 版比 CPU 版慢","detail":"作者自己量測：Ackermann(3,7) 為 30.4 秒，CPU 上的 amineLight 為 0.4 秒；Fibonacci(20) 為 10.5 秒對 0.03 秒；只有 L-System(27) 接近（1.28 秒對 1.13 秒）。interaction kernel 不到總時間的 0.1%，其餘花在 communication 與 merge。","kind":"result","actors":["ingpu"],"lane":"hardware","weight":2,"conf":"verified","src":[{"t":"arXiv:1404.0076","u":"https://arxiv.org/abs/1404.0076"}]},{"t":2015.25,"date":"2015-04","title":"HINet：多核加速有上限","detail":"Kahl 的 Concurrent Haskell 實作在 6 核上加速 2.3 到 3.1 倍；16 個硬體 thread 的 Xeon 上最高 3.84 倍，超過 9 到 10 核後變慢。作者的結論是：超過與工作相關的門檻後，同步成本使多加的 core 沒有效益。","kind":"result","actors":["hinet"],"lane":"software","weight":1,"conf":"self_reported","src":[{"t":"Kahl（arXiv 2015）","u":"https://arxiv.org/abs/1504.02603"}]},{"t":2015.5,"date":"2015","title":"Mackie–Sato：有些 net 只能循序","detail":"論文定義 sequential net（每一步至多一個 active pair），這類 net 平行後步數不變；同一個函數換一種 rule 寫法，平行步數就不同。這個理論假設處理器數量無限，整理時查閱的已審查文獻中沒有找到針對 p 個處理器的一般性 speed-up 定理。","kind":"result","actors":["mackie","sato"],"lane":"theory","weight":2,"conf":"verified","src":[{"t":"Mackie–Sato 2015","u":"https://ceur-ws.org/Vol-1403/paper5.pdf"}]},{"t":2015.579,"date":"2015-07-29","title":"Taelin 發表 Optlam","detail":"Optlam 以 JavaScript 實作 Lamping 的演算法，repo 建立於 2015-07-29。之後的 Absal（repo 建立於 2016-10-16）只實作 abstract algorithm，去掉 oracle。","kind":"release","actors":["taelin","lamping"],"lane":"software","weight":2,"conf":"verified","src":[{"t":"VictorTaelin/optlam","u":"https://github.com/VictorTaelin/optlam"},{"t":"GitHub search：VictorTaelin","u":"https://api.github.com/search/repositories?q=user:VictorTaelin&sort=stars"}]},{"t":2015.83,"date":"2015-11","title":"平行化簡的可認證複雜度上界","detail":"Gimenez 與 Moser 的 sized／scheduled 型別可以認證循序與平行化簡的時間、空間與 space-time 上界（arXiv 2015-11，POPL 2016）。論文指出平行化簡的複雜度過去在文獻中多半被略過。","kind":"paper","actors":["gimenez"],"lane":"theory","weight":2,"conf":"verified","src":[{"t":"Gimenez–Moser","u":"https://arxiv.org/abs/1511.01838"}]},{"t":2016.5,"date":"2016","title":"Inpla 的多核量測","detail":"4 核 Core i7 上，ack 3 11 從 1 個 thread 的 18.18 秒降到 4 個 thread 的 5.81 秒，作者說 4 到 5 個 thread 就達到上限。用內建整數算 fib 38 時，循序的 Inpla 要 11.39 秒，SML/NJ 只要 0.66 秒。","kind":"result","actors":["inpla","sato","mackie"],"lane":"software","weight":2,"conf":"self_reported","src":[{"t":"Mackie–Sato（ECEASST 73）","u":"https://eceasst.org/index.php/eceasst/article/view/2205"}]},{"t":2016.5,"date":"2016","title":"ia2d：格狀抽象硬體的軟體模擬","detail":"Gimenez 與 Obwaller 在 FSCD 2016 提出 interaction automata，把空間距離與資料搬移成本放進規則裡；ia2d 是 Haskell 撰寫的 interpreter，沒有電路。bitonic sort 32 個 leaf 時，sequential 的 1,740 步對應平行的 52.8 個 pass，作者說以 naive 的搬移策略還達不到潛在的平方級加速。","kind":"paper","actors":[],"lane":"hardware","weight":1,"conf":"self_reported","src":[{"t":"LIPIcs FSCD 2016","u":"https://drops.dagstuhl.de/storage/00lipics/lipics-vol052-fscd2016/LIPIcs.FSCD.2016.35/LIPIcs.FSCD.2016.35.pdf"}]},{"t":2016.67,"date":"2016-09","title":"token-passing optimal 化簡","detail":"Salikhmetov 的 optimal 編碼不論化簡策略都能到達 normal form，read-back 也在 interaction net 內完成，代價是需要 non-deterministic 的 Amb 擴充。2017 年他改做留在純 interaction net 內的 needed reduction，並指出 weak reduction 的一步至少與 term 深度成正比。","kind":"paper","actors":[],"lane":"software","weight":1,"conf":"verified","src":[{"t":"Salikhmetov 2016","u":"https://arxiv.org/abs/1609.03644"},{"t":"Salikhmetov 2017","u":"https://arxiv.org/abs/1702.06092"},{"t":"codedot/lambda","u":"https://github.com/codedot/lambda"}]},{"t":2017.0,"date":"2017-01","title":"Asperti 回顧：問題在記憶體","detail":"Asperti 說 1997 年的下界對 optimal reduction 的效率沒有下結論，至今沒有效率上的反例，bookkeeping 只多出多項式成本則仍是猜想。他把未被採用的原因歸於記憶體用量、read-back 成本沒有上界，以及一般函數式程式很少用到高階共享。","kind":"critique","actors":["asperti","bohm"],"lane":"theory","weight":3,"conf":"verified","src":[{"t":"Asperti 2017","u":"https://arxiv.org/abs/1701.04240"}]},{"t":2017.5,"date":"2017","title":"無 bookkeeping 片段的平方上界","detail":"Guerrini 與 Solieri 證明：在 elementary 與 light linear logic（不需要 bookkeeping 的片段），共享化簡的成本至多是直接做 proof-net 化簡的平方。完整 λ-calculus 的 bookkeeping 成本仍沒有被證明的上界。","kind":"result","actors":["guerrini"],"lane":"theory","weight":2,"conf":"verified","src":[{"t":"Guerrini–Solieri 2017（FSCD）","u":"https://drops.dagstuhl.de/entities/document/10.4230/LIPIcs.FSCD.2017.17"},{"t":"Asperti 2017 §3","u":"https://arxiv.org/abs/1701.04240"}]},{"t":2018.646,"date":"2018-08-23","title":"Interaction Calculus 發表","detail":"repo 建立於 2018-08-23，原名 Symmetric Interaction Calculus，具備 first-class 的 superposition 與 duplication。依 Taelin 的回顧文，同一時期他在 Ethereum Foundation 帶隊開發 proof language Formality 與 FM-Net runtime。","kind":"release","actors":["taelin","ic","kind"],"lane":"software","weight":1,"conf":"verified","src":[{"t":"VictorTaelin/Interaction-Calculus","u":"https://github.com/VictorTaelin/Interaction-Calculus"},{"t":"HOC: Complete Historical Overview","u":"https://gist.github.com/VictorTaelin/77fd5a2a8a4a07e1da6157ebca3c7cf1"}]},{"t":2022.092,"date":"2022-02-03","title":"issue #60：HVM1 的平方級退化","detail":"oxalica 在 GitHub 回報一個 list 程式：n=16000 時 HVM1 用 31.018 秒與 5.9 GB，GHC -O2 用 20 毫秒與 5.6 MB。作者承認是嚴重問題；issue 在 2024-05-16 以 HVM 已改為 HVM2 為由關閉，沒有一般性的修正。","kind":"critique","actors":["hvm"],"lane":"software","weight":2,"conf":"verified","src":[{"t":"HVM1 issue #60","u":"https://github.com/HigherOrderCO/HVM1/issues/60"}]},{"t":2022.097,"date":"2022-02-05","title":"HVM1 登上 Hacker News：493 分","detail":"HVM1 的 repo 建立於 2022-01-03，當時位於 Kindelia/HVM，以 Rust 實作 lazy 的 Interaction Calculus。README 自述單一 thread 通常比 GHC 慢 3 倍，8 個 thread 的 radix sort 比單一 thread 的 GHC 快 2.5 倍。","kind":"release","actors":["taelin","hvm"],"lane":"software","weight":3,"conf":"verified","src":[{"t":"HN 30219452","u":"https://news.ycombinator.com/item?id=30219452"},{"t":"HigherOrderCO/HVM1","u":"https://github.com/HigherOrderCO/HVM1"}]},{"t":2023.011,"date":"2023-01-04","title":"Higher Order Company 對外宣布","detail":"Hacker News 上有 2023-01-04 指向公司宣布推文的連結。依創辦人的回顧文，公司的定位是發展 HVM，並公開釋出 HVM、Bend 與 Kindelia；確切的成立日期沒有查到。","kind":"company","actors":["taelin","hoc"],"lane":"company","weight":2,"conf":"verified","src":[{"t":"HN 34252367","u":"https://news.ycombinator.com/item?id=34252367"},{"t":"HOC: Complete Historical Overview","u":"https://gist.github.com/VictorTaelin/77fd5a2a8a4a07e1da6157ebca3c7cf1"}]},{"t":2023.243,"date":"2023-03-28","title":"HOC seed：約 US$4–4.5M","detail":"Taelin 在 Hacker News 寫道募得 US$4.5M seed，目標包含改進 runtime、Kind 語言，以及最終自建硬體。他在 2024-01 的貼文則寫 US$4M、約 10 名工程師、約三年 runway；投資人名單從未公開。","kind":"funding","actors":["hoc","taelin"],"lane":"company","weight":2,"conf":"self_reported","src":[{"t":"HN 35340472","u":"https://news.ycombinator.com/item?id=35340472"},{"t":"X 貼文 2024-01-06","u":"https://x.com/VictorTaelin/status/1743751536465903795"}]},{"t":2023.611,"date":"2023-08-10","title":"HVM-64 repo 建立","detail":"HOC 組織下的 64-bit 實驗版 HVM，最後 push 在 2024-06-11。T6 後來自述是它的 lead developer。","kind":"release","actors":["hvm64","t6","hoc"],"lane":"software","weight":1,"conf":"verified","src":[{"t":"HigherOrderCO-archive/hvm-64","u":"https://github.com/HigherOrderCO-archive/hvm-64"},{"t":"HN 43144040","u":"https://news.ycombinator.com/item?id=43144040"}]},{"t":2024.38,"date":"2024-05-17","title":"Bend 1／HVM2 發表：HN 1,041 分","detail":"HVM2 論文自報 400 MIPS（Apple M3 Max 單一 thread）、5,200 MIPS（16 個 thread）與 74,000 MIPS（RTX 4090）。同一篇論文寫明單一 thread 約比 GHC 慢 5 倍，遇到 loop 與 mutable array 可達 100 倍。","kind":"release","actors":["taelin","hoc","hvm","bend"],"lane":"software","weight":3,"conf":"verified","src":[{"t":"HN 40390287","u":"https://news.ycombinator.com/item?id=40390287"},{"t":"HVM2 論文（PDF）","u":"https://raw.githubusercontent.com/HigherOrderCO/HVM2/main/paper/HVM2.pdf"}]},{"t":2024.38,"date":"2024-05-17","title":"HN 實測：4090 約等於單核 C++","detail":"ziedaniel1 回報未最佳化的單一 thread C++ loop 以 1.7 秒完成同一個加總，接近 Bend 在 RTX 4090 上的 1.88 秒，加上 -O3 則低於 80 毫秒。Taelin 更正 README：重跑為 1 個 core 33.39 秒、16 個 core 2.94 秒，實際加速約 12 倍。","kind":"critique","actors":["bend","hvm","taelin"],"lane":"software","weight":2,"conf":"verified","src":[{"t":"HN 40390287","u":"https://news.ycombinator.com/item?id=40390287"},{"t":"HN 40392826（更正）","u":"https://news.ycombinator.com/item?id=40392826"}]},{"t":2024.463,"date":"2024-06-17","title":"T6 開始開發 Vine","detail":"Vine 的 repo 建立於 2024-06-17，HVM-64 的最後 push 在六天前的 2024-06-11。Vine 編譯到 Ivy，在 IVM 上執行；T6 說 IVM 的架構近似 HVM-64，最大的差別是 IO 的處理方式。","kind":"release","actors":["t6","vine","hvm64"],"lane":"software","weight":2,"conf":"verified","src":[{"t":"VineLang/vine","u":"https://github.com/VineLang/vine"},{"t":"LWN 2025-03-05","u":"https://lwn.net/Articles/1011803/"},{"t":"HN 43144040","u":"https://news.ycombinator.com/item?id=43144040"}]},{"t":2024.469,"date":"2024-06-19","title":"Heron：FPGA core 對上行動版 i3","detail":"Heriot-Watt 的論文自報 193 MHz 的 Heron core 在 5 個 benchmark 上的 wall-clock 時間勝過 1.9 GHz 的行動版 Intel i3，約用 2% 的 FPGA 資源。論文內文未能取得，也沒有找到獨立重現。","kind":"result","actors":["heron"],"lane":"precursor","weight":2,"conf":"self_reported","src":[{"t":"Heriot-Watt research portal","u":"https://researchportal.hw.ac.uk/en/publications/heron-modern-hardware-graph-reduction/"},{"t":"DOI 10.1145/3652561.3652564","u":"https://doi.org/10.1145/3652561.3652564"}]},{"t":2024.491,"date":"2024-06-27","title":"Taelin 提出 HPU 處理器構想","detail":"標題為〈Higher Order Company - Series A〉的 gist 把主要產品寫成 IC Processor（HPU），宣稱可比 HVM-CUDA 快 100 倍。文中有 placeholder 與沒有說明依據的數字，沒有提到 FPGA、ASIC、製造或時程。","kind":"hardware","actors":["taelin","hoc","hpu"],"lane":"hardware","weight":2,"conf":"self_reported","src":[{"t":"Series A gist","u":"https://gist.github.com/VictorTaelin/2c727639f9d84269447a1d756c7354c9"}]},{"t":2024.75,"date":"2024-10","title":"Sato：條件式 nested pattern","detail":"Sato 把 nested 與條件式 pattern 做成保守擴充，編譯回純 rule，保留 interaction net 原有的性質。原本的 rule 一次只能比對一個參數，程式設計者得自己補輔助 rule。","kind":"paper","actors":["sato"],"lane":"theory","weight":1,"conf":"verified","src":[{"t":"Sato 2024","u":"https://arxiv.org/abs/2410.00540"},{"t":"Hassan–Sato 2008","u":"https://doi.org/10.1016/j.entcs.2008.03.035"}]},{"t":2024.853,"date":"2024-11-07","title":"HVM3 回到 lazy evaluation","detail":"HVM3 以 Haskell 撰寫，README 自稱結合 HVM1 與 HVM2 的長處，是 Interaction Calculus 的實作，並要求 lambda 必須 linear 或 affine。README 沒有提到 thread 或 GPU；repo 在 2026 年只有 1 個 commit。","kind":"release","actors":["hvm","ic"],"lane":"software","weight":2,"conf":"verified","src":[{"t":"HigherOrderCO/HVM3","u":"https://github.com/HigherOrderCO/HVM3"},{"t":"GitHub API：HVM3","u":"https://api.github.com/repos/HigherOrderCO/HVM3"}]},{"t":2024.853,"date":"2024-11-07","title":"Par repo 建立","detail":"Par 以 linear logic 與 Wadler 的 CP 為基礎，README 寫明編譯到 interaction combinators。到 2026-11-21 有 823 個 star、27 位 contributor，contributor 數高於 Vine 的 16 位。","kind":"release","actors":["par"],"lane":"software","weight":1,"conf":"verified","src":[{"t":"par-team/par-lang","u":"https://github.com/par-team/par-lang"},{"t":"GitHub API：par-lang","u":"https://api.github.com/repos/par-team/par-lang"}]},{"t":2025.049,"date":"2025-01-18","title":"Cremer 發表 IPU 構想","detail":"〈Interaction Processing Units〉主張專用架構對 interaction nets 的成功不可或缺：值放在使用處附近，不需要 dependency resolution 與 out-of-order execution。作者承認初期硬體多半贏不了既有的 CPU 與 GPU，文中沒有設計細節與數字，並公開徵求 co-founder。","kind":"hardware","actors":["cremer"],"lane":"hardware","weight":2,"conf":"self_reported","src":[{"t":"Interaction Processing Units","u":"http://nilscrm.dev/ipu.html"}]},{"t":2025.052,"date":"2025-01-19","title":"SupGen 首次公開示範","detail":"Taelin 在 Lean Zulip 說明 SupGen 的速度來自 HVM 的 beta-optimality 與 superposition 的共享計算；它是專有程式，沒有論文。同月他在 X 表示要以 US$100M 估值募 US$4M post-seed，用於 ARC Prize 資料集與調校 SupGen，實際募得多少沒有公開資料。","kind":"company","actors":["hoc","taelin","hvm"],"lane":"company","weight":2,"conf":"self_reported","src":[{"t":"Lean Zulip：SupGen","u":"https://leanprover-community.github.io/archive/stream/113488-general/topic/SupGen.html"},{"t":"X 貼文 2025-01-31","u":"https://x.com/VictorTaelin/status/1885328571410853951"}]},{"t":2025.18,"date":"2025-03-05","title":"LWN 評 Bend 與 Vine","detail":"Daroc Alden 實測 Bend 的 bitonic sort：單一 thread 68 秒、4 個 vCPU 25 秒、6,144 個 CUDA core 的 GPU 0.78 秒，並說這些數字應保留看待。T6 對 Vine 能否寫實際程式的回答是「Not quite yet」；同年 2 月 Vine 在 Hacker News 得到 203 分。","kind":"media","actors":["bend","vine","t6"],"lane":"software","weight":2,"conf":"verified","src":[{"t":"LWN 2025-03-05","u":"https://lwn.net/Articles/1011803/"},{"t":"HN 43144040","u":"https://news.ycombinator.com/item?id=43144040"}]},{"t":2025.33,"date":"2025-05","title":"Δ-Nets：宣稱免 delimiter","detail":"Salvadori 的 arXiv preprint 宣稱不用 delimiter 就能對完整 λ-calculus 做 optimal 平行化簡。論文自述需要 interaction 以外的 canonicalization rule 與全域化簡順序；到 2026-07 改到第 4 版，未經同儕審查。","kind":"paper","actors":["deltanets"],"lane":"theory","weight":2,"conf":"self_reported","src":[{"t":"arXiv:2505.20314","u":"https://arxiv.org/abs/2505.20314"}]},{"t":2025.441,"date":"2025-06-09","title":"Lamagraph FPGA 原型：7.5 MHz","detail":"Efim Kubyshkin 的學士論文答辯：以 Clash 撰寫的單核 interaction-net reducer，最高 7.5 MHz、2,900 個 LUT、351 個 register，在 Tang Primer 25K 上以三個小型 λ-term 測試。論文沒有 interactions per second 的數字，結論是原則上可行、資源用量小、頻率遠低於對照設計。","kind":"hardware","actors":["lamagraph"],"lane":"hardware","weight":2,"conf":"self_reported","src":[{"t":"Kubyshkin 學士論文","u":"https://se.math.spbu.ru/thesis/texts/Kubyshkin_Efim_Alekseevich_Bachelor_Thesis_2025_text.pdf"},{"t":"答辯投影片","u":"https://se.math.spbu.ru/thesis/slides/Kubyshkin_Efim_Alekseevich_Bachelor_Thesis_2025_slides.pdf"}]},{"t":2025.5,"date":"2025","title":"Tendrils 完成 pre-seed","detail":"投資人 Visionaries Club 表示在 2025 年夏天領投 pre-seed，FR8 與天使投資人跟投，金額未公開。在此之前，Visionaries 在 Nils Cremer 尋找共同創辦人期間先給了一筆 grant。","kind":"funding","actors":["tendrils","cremer"],"lane":"company","weight":2,"conf":"self_reported","src":[{"t":"Magica 2026-11-10","u":"https://magica.com/news/tendrils-compute-30-million-seed-new-cpu-architecture"},{"t":"Visionaries Club","u":"https://www.visionaries.vc/editorial/tendrils-rebuilding-the-microprocessor-from-first-principles"}]},{"t":2025.624,"date":"2025-08-15","title":"Vine 出現 FPGA target（WIP）","detail":"社群資源清單記載 Tendrils Compute 為 Vine 做的「WIP FPGA hardware target」，來源是一則 Discord 公告，訊息 ID 對應 2025-08-15。公告內文無法取得，Vine 的公開 repo 裡也看不到 RTL 或 FPGA target。","kind":"hardware","actors":["tendrils","tendrils_chip","vine"],"lane":"hardware","weight":1,"conf":"self_reported","src":[{"t":"interaction-net-resources","u":"https://github.com/marvinborner/interaction-net-resources"},{"t":"VineLang/vine","u":"https://github.com/VineLang/vine"}]},{"t":2025.855,"date":"2025-11-08","title":"HVM4 repo 建立","detail":"以 C 撰寫的 Interaction Calculus runtime，預設以 collapse mode 執行。README 到 2026-11 仍寫「you're here before launch」，最後 push 在 2026-05-30。","kind":"release","actors":["hvm","ic"],"lane":"software","weight":1,"conf":"verified","src":[{"t":"HigherOrderCO/HVM4","u":"https://github.com/HigherOrderCO/HVM4"},{"t":"GitHub API：HVM4","u":"https://api.github.com/repos/HigherOrderCO/HVM4"}]},{"t":2026.17,"date":"2026-03","title":"Inpla 0.13.4 釋出","detail":"README 的對照表顯示，8 個 thread 的 Inpla 在 list 排序上快過單執行緒的 OCaml 與 GHC，在 fib 38 上仍慢於單執行緒的 OCaml（0.46 秒對 0.15 秒）。它是學術這一脈到 2026 年仍在發版的 interaction net 實作。","kind":"release","actors":["inpla","sato"],"lane":"software","weight":1,"conf":"self_reported","src":[{"t":"inpla/inpla","u":"https://github.com/inpla/inpla"}]},{"t":2026.321,"date":"2026-04-26","title":"Tendrils 發表硬體論述文章","detail":"〈On Interaction Nets〉給出 Vine 版 LCS 的理想平行度：2000×2000 的輸入共 296,223,905 次 interaction，depth 108,142，breadth 2,739。這是假設 core 數無限的數字，沒有計入通訊成本，也沒有硬體量測。","kind":"hardware","actors":["tendrils","tendrils_chip"],"lane":"hardware","weight":2,"conf":"self_reported","src":[{"t":"On Interaction Nets","u":"https://tendrils.co/blog/2026-04-26/on-inets"},{"t":"HN 47912094","u":"https://news.ycombinator.com/item?id=47912094"}]},{"t":2026.466,"date":"2026-06-18","title":"Architect Labs seed：US$24M","detail":"Kindred Ventures 領投，Race Capital、TQ Ventures、Together Fund 參與。公司稱已與未具名的半導體公司合作，並表示 AI 產生的設計將在年內於先進製程 tape-out。","kind":"funding","actors":["architect"],"lane":"company","weight":2,"conf":"verified","src":[{"t":"Architect Labs seed 公告","u":"https://architectlabs.com/blog/seed"},{"t":"SiliconANGLE 2026-06-18","u":"https://siliconangle.com/2026/06/18/architect-labs-nabs-24m-speed-chip-design-projects-ai/"},{"t":"The Next Web 2026-06-18","u":"https://thenextweb.com/news/architect-labs-24m-seed-ai-custom-chip-design"}]},{"t":2026.655,"date":"2026-08-26","title":"Redwood：FPGA 原型實測慢於量產的對照晶片","detail":"Architect Labs 的 arXiv 論文自報由 AI 在兩週內產生一顆 AI accelerator。FPGA 版實測 Qwen3 0.6B 為 12.1 tokens/s，Jetson Orin Nano 為 28 tokens/s；3.4 倍的 performance per watt 是投影到 8 nm ASIC 的估計。","kind":"paper","actors":["architect"],"lane":"company","weight":2,"conf":"self_reported","src":[{"t":"arXiv:2608.26418","u":"https://arxiv.org/abs/2608.26418"},{"t":"alphaXiv 摘要頁","u":"https://www.alphaxiv.org/abs/2608.26418"},{"t":"VentureBeat 2026-09-18","u":"https://venturebeat.com/infrastructure/inference-chips-are-locked-in-years-before-the-models-theyll-run-architect-labs-says-ai-can-design-them-in-weeks"}]},{"t":2026.713,"date":"2026-09-17","title":"Bend 2 移除 interaction nets","detail":"BendRT 論文寫明讀者可能期待的 interaction nets「there are none」，README 寫明 Bend 1 的程式與 HVM 都不相容。Hacker News 貼文 616 分、327 則留言；Taelin 說在 raw speed 上 Bend 2 取代 HVM，HVM 留給研究者與 λ-calculus 愛好者。","kind":"release","actors":["taelin","hoc","bend","hvm"],"lane":"software","weight":3,"conf":"verified","src":[{"t":"BendRT 論文","u":"https://github.com/bendlang/bend/blob/main/paper/BendRT.pdf"},{"t":"bendlang/bend README","u":"https://raw.githubusercontent.com/bendlang/bend/main/README.md"},{"t":"HN 49746163","u":"https://news.ycombinator.com/item?id=49746163"}]},{"t":2026.719,"date":"2026-09-19","title":"HOC 的商品改為證明代理 BendAI","detail":"BendAI（社群稱 Bender）是付費的專有 proving agent，官方頁面寫它目前是包在 Anthropic、OpenAI 等模型外的一層 thin harness，SupGen 列為未來更新。Fabio Akita 把兩個 Rust 工具移植到 Bend 2 後寫道，沒有任何數字顯示 Bend 在同樣的工作上比 Rust 快。","kind":"company","actors":["hoc","bend"],"lane":"company","weight":2,"conf":"verified","src":[{"t":"bend-lang.com/bender","u":"https://bend-lang.com/bender"},{"t":"AkitaOnRails 2026-09-19","u":"https://akitaonrails.com/en/2026/09/19/new-ai-language-just-released-bend-2/"}]},{"t":2026.808,"date":"2026-10-21","title":"Lamagraph：記憶體階段佔多數 cycle","detail":"issue #77 指出所有記憶體操作都經過單一 block RAM、每個 cycle 一次，一次 reduction 約需 N+M+K 個記憶體 cycle 加約 6 個固定 cycle。提議改用 dual-port 或分 bank 的 RAM。","kind":"result","actors":["lamagraph"],"lane":"hardware","weight":1,"conf":"self_reported","src":[{"t":"issue #77","u":"https://github.com/Lamagraph/interaction-nets-in-fpga/issues/77"}]},{"t":2026.861,"date":"2026-11-10","title":"Tendrils 募得 US$30M","detail":"Benchmark 領投，Visionaries Club、UK Sovereign AI Fund、Conviction 等參與，Jack Altman 加入董事會，估值未揭露。Tech.eu 指出公司尚未公布任何硬體 benchmark，Magica 指出製程、代工夥伴與 tape-out 時程都沒有揭露。","kind":"funding","actors":["tendrils","t6","cremer"],"lane":"company","weight":3,"conf":"verified","src":[{"t":"Tendrils blog 2026-11-10","u":"https://tendrils.co/blog/2026-11-10/30m-raised"},{"t":"Tech.eu 2026-11-11","u":"https://tech.eu/2026/11/11/tendrils-compute-raises-30m-to-redo-the-cpu/"},{"t":"Magica 2026-11-10","u":"https://magica.com/news/tendrils-compute-30-million-seed-new-cpu-architecture"}]},{"t":2026.883,"date":"2026-11-18","title":"Frostbite：自報 4.59× perf/W","detail":"pre-silicon 設計：7 nm、一個 quad 0.792 mm²、GDS 的 timing 為 500 MHz。公司自報 25 個以 Vine 撰寫的 kernel 上，performance per watt 幾何平均為未具名 dual-issue in-order core 的 4.59 倍；held-out 的 15 個為 3.83 倍，範圍由 fib 的 1.15 倍到 conv2d 的 23.12 倍。","kind":"hardware","actors":["architect","frostbite","vine"],"lane":"hardware","weight":3,"conf":"self_reported","src":[{"t":"Frostbite 發表文","u":"https://architectlabs.com/blog/frostbite"}]},{"t":2026.885,"date":"2026-11-19","title":"獨立分析：尚無任何外部驗證","detail":"XenoSpectrum 與 explainx.ai 指出所有結果都是 pre-silicon，系統模擬與 RTL 的吻合是兩個設計階段估計值之間的吻合；search set 的 6.02 倍高於 held-out 的 3.83 倍，輸入規模小，baseline 未具名。能耗表中 on-chip network 與 scheduler 佔非 clock 能耗的 26%。","kind":"critique","actors":["frostbite","architect"],"lane":"hardware","weight":2,"conf":"verified","src":[{"t":"XenoSpectrum 2026-11-19","u":"https://xenospectrum.com/en/frostbite-cpu-design-energy-efficiency/"},{"t":"explainx.ai 2026-11-19","u":"https://explainx.ai/blog/architect-labs-frostbite-ai-designed-cpu-interaction-nets-4-59x-perf-per-watt-claimed-vs-verified-2026"}]},{"t":2026.888,"date":"2026-11-20","title":"Frostbite 的 HN 討論串：651 分","detail":"Hacker News 討論串有 651 分、340 則留言。留言集中在 baseline 是 in-order core、benchmark 規模小、缺少絕對數字，以及與 dataflow、Transputer、TRIPS 的相似處。","kind":"media","actors":["frostbite"],"lane":"hardware","weight":1,"conf":"verified","src":[{"t":"HN 50572503","u":"https://news.ycombinator.com/item?id=50572503"}]}],"views":[{"t":1997.33,"date":"1997","who":"Asperti、Mairson","stance":"neutral","claim":"這個下界不代表 optimal evaluation 的終結，它說明這條路線需要重新評估。","src":{"t":"Types-list 公告","u":"https://www.engineering.upenn.edu/~sweirich/types/archive/1997-98/msg00086.html"}},{"t":1997.5,"date":"1997","who":"Yves Lafont","stance":"pro","claim":"三種符號、六條 rule 的 interaction combinators 是分散式計算的 universal abstract machine。","src":{"t":"Lafont 1997","u":"https://doi.org/10.1006/inco.1997.2643"}},{"t":1998.5,"date":"1998","who":"Ian Mackie","stance":"con","claim":"有效率的 optimal reduction 實作，都得離開 interaction net 這個框架。","src":{"t":"YALE（ICFP 1998）","u":"https://doi.org/10.1145/289423.289434"}},{"t":2002.5,"date":"2002","who":"Mackie、Pinto","stance":"pro","claim":"每一步都是 constant time 的局部改寫，複製與垃圾回收也明確算在計算之內。","src":{"t":"Mackie–Pinto 2002 §1","u":"https://repositorium.uminho.pt/bitstreams/f3f5ad5e-9466-4ddf-8869-14d34ea18782/download"}},{"t":2005.5,"date":"2005","who":"Ian Mackie","stance":"con","claim":"這個語言很原始：有了相當於 λ-calculus 的核心，卻缺語法、語言構造與資料結構。","src":{"t":"Mackie 2005","u":"https://doi.org/10.1016/j.entcs.2005.02.015"}},{"t":2006.5,"date":"2006","who":"Damiano Mazza","stance":"con","claim":"計算過程本質上唯一、不會有衝突；拿來描述並行計算，從一開始就不適用。","src":{"t":"Mazza 2006 thesis","u":"https://lipn.univ-paris13.fr/~mazza/papers/Thesis-1.0.pdf"}},{"t":2015.25,"date":"2015","who":"Wolfram Kahl","stance":"con","claim":"超過與工作相關的門檻後，同步成本使多加的 core 沒有效益。","src":{"t":"Kahl（arXiv 2015）","u":"https://arxiv.org/abs/1504.02603"}},{"t":2015.5,"date":"2015","who":"Mackie、Sato","stance":"neutral","claim":"有些 net 是循序的，平行沒有好處；能平行多少，要看 rule 怎麼寫。","src":{"t":"Mackie–Sato 2015","u":"https://ceur-ws.org/Vol-1403/paper5.pdf"}},{"t":2017.0,"date":"2017","who":"Andrea Asperti","stance":"pro","claim":"有好幾類 λ-term 是 optimal reduction 勝出，至今沒有計算效率上的反例。","src":{"t":"Asperti 2017 §3","u":"https://arxiv.org/abs/1701.04240"}},{"t":2017.0,"date":"2017","who":"Andrea Asperti","stance":"con","claim":"實作 sharing graph 的主要問題在記憶體用量；函數式程式很少用到高階共享。","src":{"t":"Asperti 2017 §4.2、§6","u":"https://arxiv.org/abs/1701.04240"}},{"t":2017.044,"date":"2017-01","who":"Andrea Asperti","stance":"con","claim":"函數式程式很少動態合成函數，所以實務上沒有 optimal reduction 也能運作。","src":{"t":"arXiv:1701.04240","u":"https://arxiv.org/abs/1701.04240"}},{"t":2022.097,"date":"2022-02","who":"tromp（Hacker News）","stance":"pro","claim":"optimal beta reduction 過去只有理論價值，Taelin 多年來讓它更實用；部分加速範例看來偏人為。","src":{"t":"HN 30220951","u":"https://news.ycombinator.com/item?id=30220951"}},{"t":2022.097,"date":"2022-02","who":"pchiusano（Hacker News）","stance":"con","claim":"這是拿平行化的程式比 sequential 的程式，應該同時報告平行版 Haskell 的結果。","src":{"t":"HN 30219452","u":"https://news.ycombinator.com/item?id=30219452"}},{"t":2024.38,"date":"2024-05","who":"Victor Taelin（HN：LightMachine）","stance":"pro","claim":"我唯一的主張是效能隨 core 數線性成長；Bend 的 code generation 目前還很差。","src":{"t":"HN 40392932","u":"https://news.ycombinator.com/item?id=40392932"}},{"t":2024.38,"date":"2024-05","who":"light_hue_1（Hacker News）","stance":"con","claim":"interaction nets 在效能上一向失敗，為了平行度犧牲其他一切，包括單一 thread 的效能。","src":{"t":"HN 40392481","u":"https://news.ycombinator.com/item?id=40392481"}},{"t":2025.049,"date":"2025-01","who":"Nils Cremer","stance":"pro","claim":"既有硬體本來就不適合跑 interaction nets，需要專用架構；初期多半還贏不了現有 CPU。","src":{"t":"Interaction Processing Units","u":"http://nilscrm.dev/ipu.html"}},{"t":2025.18,"date":"2025-03","who":"Daroc Alden（LWN）","stance":"neutral","claim":"Bend 的數字應保留看待；兩個語言短期內都難與主流語言競爭，但指向有前景的研究領域。","src":{"t":"LWN 2025-03-05","u":"https://lwn.net/Articles/1011803/"}},{"t":2025.18,"date":"2025-03","who":"T6（Vine 作者，LWN 引述）","stance":"neutral","claim":"Vine 還不能用來寫實際程式；GPU 或客製硬體上的實作可以很快，我目前無意在效能上競爭。","src":{"t":"LWN 2025-03-05","u":"https://lwn.net/Articles/1011803/"}},{"t":2026.716,"date":"2026-09","who":"Victor Taelin（HN：LightMachine）","stance":"neutral","claim":"論 raw speed，Bend 2 取代 HVM；論漸近複雜度，HVM 仍然領先，留給研究者與 λ-calculus 愛好者。","src":{"t":"HN 49759386","u":"https://news.ycombinator.com/item?id=49759386"}},{"t":2026.861,"date":"2026-11","who":"Tendrils Compute","stance":"pro","claim":"傳統 CPU 受限於 cache coherency 協定與 reorder buffer；處理器應該從數千個平行 core 開始設計。","src":{"t":"Tendrils blog 2026-11-10","u":"https://tendrils.co/blog/2026-11-10/30m-raised"}},{"t":2026.861,"date":"2026-11","who":"adrian_b（Hacker News）","stance":"con","claim":"out-of-order 之所以存在，原因是記憶體讀取的 latency 遠大於指令執行的時間。","src":{"t":"HN 50447036","u":"https://news.ycombinator.com/item?id=50447036"}},{"t":2026.863,"date":"2026-11","who":"Animats（Hacker News）","stance":"con","claim":"通用型大規模平行機器的歷史不好，從 Illiac IV 到 PlayStation 3 一再失敗；機器做得出來，使用者卻不來。","src":{"t":"HN 50449198","u":"https://news.ycombinator.com/item?id=50449198"}},{"t":2026.885,"date":"2026-11","who":"XenoSpectrum（Y Kobayashi）","stance":"con","claim":"系統模擬與 RTL 的吻合只是兩個設計階段估計值的吻合；network 與 scheduler 佔 26%，overhead 只是換了位置。","src":{"t":"XenoSpectrum 2026-11-19","u":"https://xenospectrum.com/en/frostbite-cpu-design-energy-efficiency/"}},{"t":2026.888,"date":"2026-11","who":"titzer（Hacker News）","stance":"con","claim":"interaction nets 是另一種圖形化的 dataflow；同樣的想法一再被重新發現、重新命名。","src":{"t":"HN 50574986","u":"https://news.ycombinator.com/item?id=50574986"}},{"t":2026.888,"date":"2026-11","who":"kragen（Hacker News）","stance":"pro","claim":"他們主張的是 performance per watt；out-of-order 在這個指標上更差，拿 in-order 當基準合理。","src":{"t":"HN 50573236","u":"https://news.ycombinator.com/item?id=50573236"}},{"t":2026.89,"date":"2026-11","who":"Lawrence Lundy-Bryan（Tendrils 投資方）","stance":"neutral","claim":"confluence 與平行性是必要條件，但還不夠；歷來的失敗原因是 constant factor，硬體尚未被證明。","src":{"t":"State of the Future","u":"https://stateofthefuture.io/compute/non-conventional/interaction-nets/"}}],"threads":[{"name":"讓它跑得快的四次嘗試","segs":[{"from":1990.0,"to":1998.1,"label":"① optimal reduction\n靠 sharing 少做重複的計算；1998 年後留在學界","status":"done"},{"from":2000.0,"to":2016.5,"label":"② 多核心與 GPU 上的 evaluator\n4 個 core 量到 3 到 4 倍","status":"done"},{"from":2022.08,"to":2026.71,"label":"③ HVM、Bend：幾千個 thread 與 GPU\n2026-09 Bend 2 的 runtime 拿掉 interaction net","status":"stalled"},{"from":2025.0,"to":2026.89,"label":"④ 專用晶片（進行中，還沒有實體晶片）","status":"ongoing"}]}],"eras":[{"from":1974.0,"to":1990.0,"dot":"1974–89","span":"1974 → 1989","name":"前身","summary":"平行機器的第一波，linear logic 出現","title":"1974 到 1989：非 von Neumann 機器的第一波熱潮，以及理論的源頭","html":"<p><b>誰<\/b>：這一段還沒有 interaction net。場景後方的灰色橫條是它的前例：dataflow machine、graph reduction machine、Lisp machine、Transputer、Connection Machine、Fifth Generation。這些機器大多做出來了，也大多能動。<\/p><p><b>觀點<\/b>：當時的主張是「程式本身就帶有平行度，換一種機器就能直接利用」。這和 2026 年新創的說法很接近，所以這一排前例值得先看：它們後來都沒有成為通用電腦，文獻記載的主因是一般 CPU 每年進步得比專用機器快。<\/p><p><b>理論<\/b>：Lévy 在 1978 年定義了 lambda calculus 的 optimal reduction，Girard 在 1987 年提出 linear logic。Interaction net 是從這兩條線長出來的。<\/p>","axes":{"theory":"源頭：optimal reduction 的定義、linear logic","software":"還沒有","hardware":"還沒有；同一族的前例正熱","company":"還沒有"}},{"from":1990.0,"to":1999.0,"dot":"1990–98","span":"1990 → 1998","name":"提出與第一次嘗試","summary":"Lafont 的 interaction net，optimal reduction 的十年","title":"1990 到 1998：interaction net 提出，第一次嘗試是 optimal reduction","html":"<p><b>誰<\/b>：Yves Lafont 在 POPL 1990 發表 interaction net。同一屆 John Lamping 發表 optimal reduction 的演算法，Gonthier、Abadi、Lévy 在 1992 年把這個演算法寫成 interaction net。Andrea Asperti 的團隊在波隆那做出第一個完整的實作 BOHM。<\/p><p><b>觀點<\/b>：這個 abstract machine 保證三件事：一次改寫只動相鄰的兩個 node、每個 port 只接一條 wire、不論先做哪一對，結果和總步數都一樣。它不保證程式會停，也不保證平行執行會變快。<\/p><p><b>轉折<\/b>：這十年的希望放在 optimal reduction，也就是靠 sharing 避免重複計算。BOHM 在作者挑的高階函式程式上大勝，在一般程式上慢約十倍。Asperti 與 Mairson 在 1997 年公告、POPL 1998 發表的結果顯示，optimal 的一步可以貴到沒有 elementary 的上界，所以步數不能當成執行時間；兩位作者說這不代表這條路線結束。之後這條路線留在學界。<\/p>","axes":{"theory":"成形：規則、演算法、三種 node 就夠","software":"第一輪：BOHM","hardware":"還沒有；前例陸續收場","company":"還沒有"}},{"from":1999.0,"to":2015.0,"dot":"1999–2014","span":"1999 → 2014","name":"學界小眾期","summary":"語言、evaluator、平行化實驗；論文數在 2005–09 最高","title":"1999 到 2014：留在學界，做語言、evaluator 和平行化實驗","html":"<p><b>誰<\/b>：Ian Mackie、Maribel Fernández、Jorge Sousa Pinto、Damiano Mazza、Shinya Sato 這些研究者。成果多半是一篇論文配一個原型：文字語法、編譯 lambda calculus 的方法、平行的 abstract machine、巢狀 pattern matching。<\/p><p><b>觀點<\/b>：這一段的問題從「能不能做到 optimal」換成「能不能成為實用的執行方式」。量到的結果是：兩個到四個 core 上有加速，單一 thread 比傳統 compiler 的產出慢。<\/p><p><b>熱度<\/b>：後排的長條是標題含 interaction net 的論文數。2005 到 2009 年五年 28 篇，是歷年最高；2020 年之後每五年只剩一兩篇。<\/p><p><b>對照<\/b>：同一時期，前例那條 lane 上有兩個量得到數字的硬體：2009 年的 TRIPS 做出 tile 式 dataflow 晶片，2012 年的 Reduceron 在 FPGA 上做 graph reduction。兩者都沒有贏過同時期的一般 CPU。<\/p>","axes":{"theory":"擴充與分析，論文數最多","software":"第二輪：學界的 evaluator，多核心與 GPU","hardware":"還沒有；前例裡有兩次實測","company":"還沒有"}},{"from":2015.0,"to":2024.0,"dot":"2015–23","span":"2015 → 2023","name":"走進開發者社群","summary":"Taelin 的 HVM 系列，第一家公司成立","title":"2015 到 2023：一位開發者把它從學界帶到 GitHub 和 Hacker News","html":"<p><b>誰<\/b>：Victor Taelin。他從個人專案做起，一路做了 Absal、Formality、Kind，2022 年發表 HVM1，2023 年成立 Higher Order Company 並募得 seed。<\/p><p><b>觀點<\/b>：他把賣點從「optimal」換成「不用寫 thread 也會自動平行」，目標是多核心 CPU 和 GPU。HVM1 的 README 自己寫明單一 thread 通常比 GHC 慢三倍，贏的例子是 8 個 core 對單一 thread。<\/p><p><b>熱度<\/b>：這是 interaction net 第一次有產業界的注意。在這之前它沒有熱過。熱過再沉寂的是它所屬的那一族，也就是第一站的 dataflow 與 graph reduction 機器。<\/p>","axes":{"theory":"零星","software":"第三輪開始：HVM 走進開發者社群","hardware":"還沒有","company":"第一家公司，第一筆資金"}},{"from":2024.0,"to":2026.0,"dot":"2024–25","span":"2024 → 2025","name":"爆紅與質疑","summary":"Bend 登上首頁；有人開始談硬體","title":"2024 到 2025：Bend 爆紅，效能受到質疑，硬體的想法出現","html":"<p><b>誰<\/b>：Higher Order Company 在 2024 年 5 月發表 Bend 與 HVM2，在 Hacker News 拿到 1,041 分，GitHub star 四週內從一萬一增加到一萬六。T6 原本開發 HVM-64，後來自己做了語言 Vine。Nils Cremer 在 2025 年 1 月寫了一篇談 interaction net 專用處理器的文章，之後和 T6 等人成立 Tendrils。<\/p><p><b>觀點<\/b>：質疑集中在基礎速度。HVM2 論文自述單一 thread 比 GHC 慢約五倍；Hacker News 上有人量到，Bend 在 RTX 4090 上的時間大約等於沒開最佳化的單一 thread C++ 迴圈。支持的一方則開始主張：問題出在硬體不合適，應該做專用晶片。<\/p><p><b>硬體<\/b>：聖彼得堡大學的 Lamagraph 是整理時找到的第一個 interaction net FPGA 原型：程式庫建立於 2024 年 8 月，2025 年 6 月有書面報告，單核心、7.5 MHz。<\/p>","axes":{"theory":"零星","software":"第三輪高峰：Bend；Vine 出現","hardware":"第一個 FPGA 原型","company":"第二家公司成立"}},{"from":2026.0,"to":2027.0,"dot":"2026","span":"2026（到 11 月）","name":"一家轉向，兩家進場","summary":"Bend 2 拿掉 interaction net；Tendrils 與 Frostbite","title":"2026：最早的實作者轉向，兩家晶片新創進場","html":"<p><b>誰<\/b>：三家公司走向不同的方向。Higher Order Company 在 9 月發表 Bend 2，runtime 不再使用 interaction net，公司轉去做 AI 的證明工具。Tendrils 在 11 月 10 日宣布募得 3,000 萬美元，由 Benchmark 領投。Architect Labs 在 11 月 18 日發表 Frostbite，一顆由 AI 設計、以 interaction net 為基礎的 CPU，benchmark 程式用 Vine 寫。<\/p><p><b>觀點<\/b>：做了十年軟體的人說，在一般硬體上做不到和傳統做法一樣快。兩家新創的回答是換硬體。到 11 月為止，兩家都沒有實體晶片、沒有具名客戶，也沒有第三方量測；Frostbite 的 4.59x 是 pre-silicon 的自述，比較對象是一顆不具名的 in-order core。<\/p><p class=\"note\">這一年的事件最密，時間軸在這裡畫得最寬。<\/p>","stars":true,"axes":{"theory":"零星","software":"第三輪收場：Bend 2 不再用它","hardware":"第一份 pre-silicon 設計","company":"兩筆資金進場，還沒有產品"}}],"metrics":{"funding":[{"t":2023.243,"date":"2023-03-28","company":"hoc","usd_m":4,"label":"約 $4M seed（另說 $4.5M）","conf":"self_reported","src":{"t":"HN 35340472","u":"https://news.ycombinator.com/item?id=35340472"}},{"t":2026.466,"date":"2026-06-18","company":"architect","usd_m":24,"label":"$24M · Kindred 領投","conf":"verified","src":{"t":"Architect Labs seed 公告","u":"https://architectlabs.com/blog/seed"}},{"t":2026.861,"date":"2026-11-10","company":"tendrils","usd_m":30,"label":"$30M · Benchmark 領投","conf":"verified","src":{"t":"Tendrils blog 2026-11-10","u":"https://tendrils.co/blog/2026-11-10/30m-raised"}}],"stars":[{"repo":"bendlang/bend","stars":25714,"asof":"2026-11-21","note":"原 HigherOrderCO/Bend；2026-09-17 為 19,837","src":{"t":"GitHub API","u":"https://api.github.com/repos/bendlang/bend"}},{"repo":"HigherOrderCO/HVM1","stars":11375,"asof":"2026-11-21","note":"原 Higher ":"https://api.github.com/search/repositories?q=user:VictorTaelin&sort=stars"}},{"repo":"xieyuheng/inet-cute","stars":132,"asof":"2026-11-21","note":"最後 push 2025-07-20","src":{"t":"inet-cute repo","u":"https://github.com/xieyuheng/inet-cute"}},{"repo":"HigherOrderCO/HVM4","stars":130,"asof":"2026-11-21","note":"README 仍寫 before launch","src":{"t":"GitHub API","u":"https://api.github.com/repos/HigherOrderCO/HVM4"}},{"repo":"SrGaabriel/soma","stars":89,"asof":"2026-11-21","note":"最後 push 2026-11-19","src":{"t":"soma repo","u":"https://github.com/SrGaabriel/soma"}},{"repo":"danaugrs/deltanets","stars":59,"asof":"2026-11-21","note":"Δ-Nets；最後 push 2026-07-22","src":{"t":"deltanets repo","u":"https://github.com/danaugrs/deltanets"}},{"repo":"etiamz/optiscope","stars":52,"asof":"2026-11-21","note":"最後 push 2026-10-06","src":{"t":"optiscope repo","u":"https://github.com/etiamz/optiscope"}},{"repo":"HigherOrderCO/HVM2","stars":47,"asof":"2026-11-21","note":"與 HVM1 repo 的內容分工不清楚","src":{"t":"GitHub API：HigherOrderCO","u":"https://api.github.com/orgs/HigherOrderCO/repos?per_page=100&type=public"}},{"repo":"euschn/ingpu","stars":18,"asof":"2026-11-21","note":"最後 push 2011-11-30","src":{"t":"ingpu repo","u":"https://github.com/euschn/ingpu"}},{"repo":"Lamagraph/interaction-nets-in-fpga","stars":4,"asof":"2026-11-21","note":"83 個 commit、43 個 open issue","src":{"t":"Lamagraph repo","u":"https://github.com/Lamagraph/interaction-nets-in-fpga"}}],"papers":[{"from":1990,"to":1995,"n":2},{"from":1995,"to":2000,"n":13},{"from":2000,"to":2005,"n":13},{"from":2005,"to":2010,"n":28},{"from":2010,"to":2015,"n":13},{"from":2015,"to":2020,"n":11},{"from":2020,"to":2025,"n":2},{"from":2025,"to":2026.89,"n":1}],"papers_caption":"標題含 interaction net(s) 的論文數（DBLP，2026-11-21）"},"judge":{"checklist":[{"id":"C1","name":"阻礙已解除","question":"有沒有一個說得出名字的阻礙，已經被一個有日期可查的條件解除？","status":"partial","in":"支持者把阻礙定義為跑在不合適的硬體上；用來解除它的晶片還沒做出來","src":[{"t":"Cloudberry VC：Why We Invested","u":"https://cloudberry.vc/news/why-we-invested-in-tendrils/"}]},{"id":"C2","name":"小規模已實用","question":"沉寂期間，它是否已經在真實任務上小規模運作？","status":"unmet","in":"查無具名 production 使用者，沒有晶片；Bend 2 runtime 已不用 interaction net","src":[{"t":"AkitaOnRails（2026-09-19）","u":"https://akitaonrails.com/en/2026/09/19/new-ai-language-just-released-bend-2/"}]},{"id":"C3","name":"配合現有平台","question":"它是否適合現有的硬體與軟體，或者所需的平台已經由另一個大眾市場出資？","status":"unmet","in":"論點正是現有 CPU 與 GPU 不合用；沒有消費市場替這顆晶片出資","src":[{"t":"Nils Cremer：Interaction Processing Units","u":"http://nilscrm.dev/ipu.html"}]},{"id":"C4","name":"贏過對手進步","question":"在產品壽命內，它的優勢是否跑得贏既有主流技術的進步速度？","status":"met","in":"通用 CPU 單一 thread 年增約 3%，1986–2002 年約 50%；專用晶片的損益平衡量下降 5–12 倍","src":[{"t":"Hennessy 與 Patterson，CACM 2019","u":"https://cacm.acm.org/research/a-new-golden-age-for-computer-architecture/"},{"t":"Thompson 與 Spanuth，2018","u":"https://ide.mit.edu/wp-content/uploads/2018/11/SSRN-id3287769.pdf"}]},{"id":"C5","name":"benchmark","question":"它是否在買方在意的公開 benchmark 或工作負載上，取得大幅而且可以重現的勝利？","status":"unmet","in":"沒有晶片量測；Frostbite 4.59x 是 pre-silicon 自述，Tendrils 未公布量測","src":[{"t":"Architect Labs：Frostbite","u":"https://architectlabs.com/blog/frostbite"},{"t":"Tendrils：On Interaction Nets","u":"https://tendrils.co/blog/2026-04-26/on-inets"}]},{"id":"C6","name":"舊軟體照用","question":"現有軟體是否能繼續使用，或者重寫的成本相對於收益很小？","status":"unmet","in":"必須改用 Vine，Rust 不能直接編譯；以 AI 協助移植的說法還沒有人示範","src":[{"t":"Tendrils：On Interaction Nets","u":"https://tendrils.co/blog/2026-04-26/on-inets"},{"t":"Cloudberry VC：Why We Invested","u":"https://cloudberry.vc/news/why-we-invested-in-tendrils/"},{"t":"Business Model Analyst（2026-11-11）","u":"https://businessmodelanalyst.com/benchmark-tendrils-30m-cpu-vine-language/"}]},{"id":"C7","name":"不靠自動平行","question":"它是否不必依賴尚未證實的、由 compiler 或 runtime 自動找出平行度的能力？","status":"unknown","in":"平行度來自 net 的結構，不必由 compiler 尋找；負擔轉到新語言與 runtime 排程，效果未知","src":[{"t":"Tendrils：On Interaction Nets","u":"https://tendrils.co/blog/2026-04-26/on-inets"},{"t":"Harris 與 Singh，ICFP 2007","u":"https://timharris.uk/papers/2007-fdip.pdf"},{"t":"Leiserson 等，Science 2020","u":"https://www.science.org/doi/10.1126/science.aam9744"}]},{"id":"C8","name":"平行度與局部性","question":"目標工作負載是否同時有足夠的平行度與 locality，而且粒度大到足以回收額外的開銷？","status":"unknown","in":"理論平行度從約 12 到 2,739 都有；不規則負載的 locality 與每次 interaction 的開銷未公布","src":[{"t":"Tendrils：On Interaction Nets","u":"https://tendrils.co/blog/2026-04-26/on-inets"},{"t":"Architect Labs：Frostbite","u":"https://architectlabs.com/blog/frostbite"},{"t":"Leiserson 等，Science 2020","u":"https://www.science.org/doi/10.1126/science.aam9744"}]},{"id":"C9","name":"急迫的需求","question":"是否有一個急迫而且持續成長、有買方的工作負載在拉動它？","status":"unknown","in":"支持者點名 AI agent 的工具執行；還沒有證據顯示瓶頸在這裡，AMD 的 Zen 6 EPYC 也主打同一題材","src":[{"t":"Cloudberry VC：Why We Invested","u":"https://cloudberry.vc/news/why-we-invested-in-tendrils/"},{"t":"Sacra：Tendrils Compute","u":"https://sacra.com/c/tendrils-compute/"}]},{"id":"C10","name":"出貨量與資金","question":"出貨量與資金是否足以攤提固定成本，而且資金不只依賴單一出資者？","status":"partial","in":"Tendrils 募得 3,000 萬美元，投資人多元；一代晶片約需 3,000 萬到 8,000 萬美元，尚無出貨量","src":[{"t":"Tendrils：$30M Raised to Redo the CPU","u":"https://tendrils.co/blog/2026-11-10/30m-raised"},{"t":"Thompson 與 Spanuth，2018","u":"https://ide.mit.edu/wp-content/uploads/2018/11/SSRN-id3287769.pdf"}]},{"id":"C11","name":"生態與工具","question":"軟體生態與工具鏈是否已經存在，或者能以低成本建立？","status":"partial","in":"Vine 約 490 顆 GitHub star、沒有正式 release；語言與晶片由同一個團隊垂直整合","src":[{"t":"GitHub：VineLang/vine","u":"https://github.com/VineLang/vine"},{"t":"Hennessy 與 Patterson，CACM 2019","u":"https://cacm.acm.org/research/a-new-golden-age-for-computer-architecture/"}]},{"id":"C12","name":"隨算力擴展","question":"增加運算資源時，它是否不必針對個別問題手工調整就能跟著變快？","status":"unknown","in":"目標是幾千個 core；軟體實測 16 thread 約 12 倍（自述）、4 vCPU 約 2.7 倍，硬體未量測","src":[{"t":"Bend GUIDE.md（mirror）","u":"https://github.com/Farbod18/Bend_Parallel_Computing/blob/main/GUIDE.md"},{"t":"LWN（2025-03-05）","u":"https://lwn.net/Articles/1011803/"}]},{"id":"C13","name":"利基與漸進","question":"它是否有一個利基起點，以及一條漸進的路徑，例如附加的加速器、DSA、library 或語言特性？","status":"met","in":"Cremer 列出離散最佳化、sparse graph 等窄目標；Vine 先在一般硬體上可用，算力規劃以 API 提供","src":[{"t":"Nils Cremer：Interaction Processing Units","u":"http://nilscrm.dev/ipu.html"},{"t":"Cloudberry VC：Why We Invested","u":"https://cloudberry.vc/news/why-we-invested-in-tendrils/"}]}],"precedents":{"lead_html":"<p>沒有以通用運算的身分回來的架構，文獻記載的原因集中在五類：通用處理器進步得比專用機器快、寄望 compiler 或語言找出平行度、粒度太細而且 locality 差、既有軟體不能執行、沒有能自給自足的市場。最接近 interaction-net 硬體的前例是 graph reduction machine；Haskell 的幾位設計者回顧時寫道，這類架構導向的研究大多沒有結果，因為一般架構上的好 compiler 後來勝過了專用架構。<\/p><p>成功回來的想法都是被吸收進既有平台，使用者不必丟掉原有的軟體。五類原因當中，第一類所依賴的條件（單一 thread 效能每年成長約 50%）已經結束。2005 年之後營運的 many-core 公司同樣處在這個條件下，其中沒有一家建立起通用處理器事業。<\/p>","failed":[{"name":"Dataflow machine","years":"1970s–1980s","promise":"各種平行路線中最激進的一種","why":"指令粒度太細，無法有效分散到大型網路；token 傳遞時間超過運算本身","src":{"t":"Wikipedia：Dataflow architecture","u":"https://en.wikipedia.org/wiki/Dataflow_architecture"}},{"name":"Graph reduction 機器","years":"1980–1993","promise":"為函數式語言設計的平行機器","why":"客製機器做得慢又貴，效能優勢被下一代一般硬體抹平","src":{"t":"Naylor 與 Runciman，JFP 2012","u":"https://doi.org/10.1017/S0956796812000214"}},{"name":"Lisp machine","years":"至 1990s 初","promise":"專為 Lisp 設計的電腦","why":"便宜的桌上型 PC 跑 Lisp 變得更快；1988 年累計約 7,000 台","src":{"t":"Wikipedia：Lisp machine","u":"https://en.wikipedia.org/wiki/Lisp_machine"}},{"name":"Transputer","years":"1983–1989","promise":"搭配 occam 語言的平行處理器","why":"被 RISC 超越，性價比差；無 virtual memory，難移植 Unix","src":{"t":"Wikipedia：Transputer","u":"https://en.wikipedia.org/wiki/Transputer"}},{"name":"Fifth Generation","years":"1982–1994","promise":"邏輯程式語言的平行推論機","why":"被較不專用的 Sun 工作站與 x86 超越；總支出略低於 570 億日圓","src":{"t":"Wikipedia：Fifth Generation Computer Systems","u":"https://en.wikipedia.org/wiki/Fifth_Generation_Computer_Systems"}},{"name":"Connection Mach.","years":"1983–1994","promise":"大規模平行的超級電腦","why":"獲利部分仰賴 DARPA 合約；1991 年採購縮減，1994 年聲請破產","src":{"t":"Wikipedia：Thinking Machines Corporation","u":"https://en.wikipedia.org/wiki/Thinking_Machines_Corporation"}},{"name":"Itanium / EPIC","years":"2001–2021","promise":"把工作從硬體移給 compiler","why":"整數程式效能不佳，執行 x86 軟體的能力差；市場改選 x86-64","src":{"t":"Hennessy 與 Patterson，CACM 2019","u":"https://cacm.acm.org/research/a-new-golden-age-for-computer-architecture/"}},{"name":"TRIPS / EDGE","years":"2003–2009","promise":"單一處理器達到 1 TFLOPS","why":"compiler 編出的整數程式，cycle 數是 Core 2 的兩倍以上","src":{"t":"Gebhart 等，ASPLOS 2009","u":"https://www.cs.utexas.edu/~skeckler/pubs/asplos09.pdf"}},{"name":"Auto-parallel FP","years":"1993–2013","promise":"函數式程式不改寫就自動平行","why":"扣掉開銷後，7 個程式只快 10–80%；有些程式找不到平行度","src":{"t":"Harris 與 Singh，ICFP 2007","u":"https://timharris.uk/papers/2007-fdip.pdf"}}],"absorbed":[{"name":"Out-of-order","years":"1966–1995","how":"CPU 內部受限的 dataflow，window 僅 32–200 道指令","src":{"t":"Wikipedia：Dataflow architecture","u":"https://en.wikipedia.org/wiki/Dataflow_architecture"}},{"name":"TensorFlow graph","years":"2016","how":"以粗粒度的 dataflow graph 表示運算，跑在現有硬體上","src":{"t":"Abadi 等，OSDI 2016","u":"https://www.usenix.org/conference/osdi16/technical-sessions/presentation/abadi"}},{"name":"Rust ownership","years":"1990–2015","how":"linear types 以 ownership 形式進入與 C 相容的系統語言","src":{"t":"Crichton 等，arXiv:2301.02308","u":"https://arxiv.org/pdf/2301.02308"}},{"name":"GPGPU / CUDA","years":"2006–2012","how":"附加在大眾市場裝置上的加速器，由深度學習帶動","src":{"t":"Nvidia corporate timeline","u":"https://www.nvidia.com/en-gb/about-nvidia/corporate-timeline.md"}},{"name":"SAT / CDCL","years":"1962–2001","how":"CDCL 加上 EDA 需求與公開競賽，成為一般硬體上的工具","src":{"t":"Malik 與 Zhang，CACM 2009","u":"https://cacm.acm.org/magazines/2009/8/34498-boolean-satisfiability-from-theoretical-hardness-to-practical-success"}},{"name":"Actor / Erlang","years":"1973–1998","how":"以 Erlang/OTP 這類 runtime 跑在一般硬體，起點是電信交換機","src":{"t":"Wikipedia：Erlang","u":"https://en.wikipedia.org/wiki/Erlang_(programming_language)"}}],"manycore":[{"name":"Tilera","years":"至 2014","outcome":"被 EZchip 收購；設計後來成為 Nvidia BlueField DPU","src":{"t":"Wikipedia：Tilera","u":"https://en.wikipedia.org/wiki/Tilera"}},{"name":"Adapteva","years":"2008–2016","outcome":"Kickstarter 募約 90 萬美元；1,024-core 晶片未見上市","src":{"t":"Olofsson，Epiphany-V，arXiv:1610.01832","u":"https://arxiv.org/pdf/1610.01832.pdf"}},{"name":"Kalray","years":"至 2026","outcome":"2025 年宣布出售資產，轉向 DPU 類加速器的 IP 模組","src":{"t":"Euronext：Kalray 2025 年報公告","u":"https://live.euronext.com/en/products/equities/company-news/2026-04-23-2025-annual-results-ebitda-eur-62-million-new-scope"}},{"name":"SpiNNaker","years":"2024–2025","outcome":"SpiNNaker2 於 2024 年 5 月商用，首批客戶屬研究用途","src":{"t":"TechPowerUp（2024-05-08）","u":"https://techpowerup.com/322255/spinncloud-systems-announces-first-commercially-available-neuromorphic-supercomputer"}},{"name":"Graphcore","years":"至 2024","outcome":"募得近 7 億美元；2022 年營收 210 萬英鎊；賣給 SoftBank","src":{"t":"TechCrunch（2024-07-11）","u":"https://techcrunch.com/2024/07/11/softbank-acquires-uk-ai-chipmaker-graphcore"}},{"name":"Cerebras","years":"2026 IPO","outcome":"專攻深度學習負載；2026 年 5 月 IPO 募得 55.5 億美元","src":{"t":"SiliconANGLE（2026-05-13）","u":"https://siliconangle.com/2026/05/13/cerebras-prices-shares-185-ahead-biggest-tech-ipo-years/"}},{"name":"Esperanto","years":"2014–2025","outcome":"1,088 個 RISC-V core；客戶很少，2025 年 7 月結束營運","src":{"t":"Jon Peddie Research","u":"https://www.jonpeddie.com/news/ainekko-acquires-esperanto-ip/"}}],"title":"同一族的前例都沒有成為通用電腦；當年最主要的原因現在已經不成立"},"arguments":{"lead_html":"<p>兩邊的論點都具體。支持的一方多半是公司與投資人的自述，懷疑的一方多半是 Hacker News 上的留言與少數獨立分析；截至 2026 年 11 月，查不到 computer architect 或程式語言學者為任何一方寫過完整的公開評論。<\/p>","pro":[{"who":"Visionaries Club（Tendrils 投資方）","date":"2026-11","claim":"時脈自 2000 年代中期停滯，每個 core 的效能年增放慢到約 5–10%","short":"單核心進步放慢","src":{"t":"Visionaries Club editorial","u":"https://www.visionaries.vc/editorial/tendrils-rebuilding-the-microprocessor-from-first-principles"}},{"who":"Tendrils Compute","date":"2026-04","claim":"compiler 把程式排成線性，CPU 花功耗與面積找回平行度；interaction net 把相依資訊留到最底層","short":"相依資訊留到硬體","src":{"t":"Tendrils：On Interaction Nets","u":"https://tendrils.co/blog/2026-04-26/on-inets"}},{"who":"Nils Cremer","date":"2025-01","claim":"CPU cache 跟不上圖狀的記憶體存取，GPU 會遇到 warp divergence；專用硬體可把資料放在使用處旁","short":"現有硬體不適合","src":{"t":"Nils Cremer：Interaction Processing Units","u":"http://nilscrm.dev/ipu.html"}},{"who":"Cloudberry VC（Tendrils 投資方）","date":"2026-11","claim":"AI agent 有數百萬個會分支、會等工具回應的小任務，CPU 與 GPU 都不適合這種負載","short":"agent 是新負載","src":{"t":"Cloudberry VC：Why We Invested","u":"https://cloudberry.vc/news/why-we-invested-in-tendrils/"}},{"who":"Cloudberry VC（Tendrils 投資方）","date":"2026-11","claim":"AI 讓晶片設計更快更便宜，移植程式也變容易，而且 Vine 看起來很像 Rust","short":"AI 降低進入成本","src":{"t":"Cloudberry VC：Why We Invested","u":"https://cloudberry.vc/news/why-we-invested-in-tendrils/"}},{"who":"kragen（Hacker News）","date":"2026-11","claim":"Frostbite 比的是每瓦效能；out-of-order core 在這項指標較差，in-order 是較難贏的基準","short":"比較基準算嚴格","src":{"t":"Hacker News 50573236","u":"https://news.ycombinator.com/item?id=50573236"}}],"con":[{"who":"Victor Taelin（HVM 作者）","date":"2026-09","claim":"Bend 2 的 GPU 版這次沒有 interaction net 的開銷；純速度上 Bend 2 取代 HVM","short":"主要實作者棄用","src":{"t":"Hacker News 49746163","u":"https://news.ycombinator.com/item?id=49746163"}},{"who":"Lawrence Lundy-Bryan（Cloudberry VC，Tendrils 投資方）","date":"2026-11","claim":"confluence 與平行度是必要條件，但還不夠；歷來讓這條路失敗的是 constant factor","short":"constant factor","src":{"t":"State of the Future：interaction nets","u":"https://stateofthefuture.io/compute/non-conventional/interaction-nets/"}},{"who":"Animats（Hacker News）","date":"2026-11","claim":"通用大規模平行機器的紀錄不好，從 Illiac IV 到 PlayStation 3 一再失敗；做得出來，使用者沒有來","short":"前例一再失敗","src":{"t":"Hacker News 50449198","u":"https://news.ycombinator.com/item?id=50449198"}},{"who":"Flavia Moura（Business Model Analyst）","date":"2026-11","claim":"需要新語言的晶片，贏過既有產品的幅度要大到足以支付重寫軟體的成本","short":"要贏到值得重寫","src":{"t":"Business Model Analyst（2026-11-11）","u":"https://businessmodelanalyst.com/benchmark-tendrils-30m-cpu-vine-language/"}},{"who":"fanf2（Hacker News）","date":"2026-11","claim":"這類架構以往跑的語言 locality 差，底層依賴 mutation；看不出 interaction net 如何處理","short":"locality 沒有解答","src":{"t":"Hacker News 50455323","u":"https://news.ycombinator.com/item?id=50455323"}},{"who":"adrian_b（Hacker News）","date":"2026-11","claim":"很慢的 CPU 的 performance per watt 向來都很好，所以單看這項指標能證明的事情有限","short":"每瓦效能說明有限","src":{"t":"Hacker News 50572503","u":"https://news.ycombinator.com/item?id=50572503"}}],"title":"支持的一方說時機到了，質疑的一方說這些主張以前出現過"},"evidence":[{"topic":"BOHM 無 sharing","number":"慢約 10 倍；數值運算最多慢 50 倍","baseline":"Caml Light（bytecode ML）","who":"作者自述","date":"1996","src":{"t":"Asperti 等，BOHM，JFP 1996","u":"https://www.cambridge.org/core/journals/journal-of-functional-programming/article/bologna-optimal-higherorder-machine/1F2763B0F931680F9B15BDC750BEB343"}},{"topic":"BOHM 有 sharing","number":"mergesort：3.13 s 對 179.80 s","baseline":"Caml Light；benchmark 由作者挑選","who":"作者自述","date":"1996","src":{"t":"Asperti 等，BOHM，JFP 1996","u":"https://www.cambridge.org/core/journals/journal-of-functional-programming/article/bologna-optimal-higherorder-machine/1F2763B0F931680F9B15BDC750BEB343"}},{"topic":"MPINE 雙處理器","number":"2 個 processor 耗時為 52.7%–110%","baseline":"作者的 sequential reducer（表格經 OCR）","who":"作者自述","date":"2001","src":{"t":"Pinto，MPINE，RTA 2001","u":"https://hdl.handle.net/1822/773"}},{"topic":"ingpu（GPU）","number":"Fibonacci(20)：10.5 s 對 0.03 s","baseline":"同一台機器的 sequential amineLight","who":"作者自述","date":"2012","src":{"t":"Jiresch，ingpu，arXiv:1404.0076","u":"https://arxiv.org/abs/1404.0076"}},{"topic":"HINet 多核心","number":"最多 3.84 倍（9–10 個 core），之後變慢","baseline":"16-thread Xeon 上同一程式的 1-core 執行","who":"作者自述","date":"2015","src":{"t":"Kahl，HINet，arXiv:1504.02603","u":"https://arxiv.org/abs/1504.02603"}},{"topic":"Inpla 4 thread","number":"fib 38：4 個 thread 4.40 s","baseline":"SML/NJ 單一 thread 0.66 s","who":"作者自述","date":"2016","src":{"t":"Mackie 與 Sato，ECEASST 73","u":"https://eceasst.org/index.php/eceasst/article/view/2205"}},{"topic":"HVM1 issue #60","number":"n=16000：31.018 s、5.9 GB","baseline":"GHC -O2：20 ms、5.6 MB","who":"獨立量測","date":"2022","src":{"t":"HVM1 issue #60","u":"https://github.com/HigherOrderCO/HVM1/issues/60"}},{"topic":"HVM2 單一 thread","number":"慢約 5 倍；迴圈與可變陣列可達 100 倍","baseline":"GHC","who":"作者自述","date":"2024","src":{"t":"HVM2 論文原始檔","u":"https://raw.githubusercontent.com/HigherOrderCO/HVM/main/paper/HVM2.typst"}},{"topic":"HVM2 擴展性","number":"400／5,200／74,000 MIPS","baseline":"M3 Max 1 與 16 個 thread／RTX 4090","who":"作者自述","date":"2024","src":{"t":"HVM2 論文原始檔","u":"https://raw.githubusercontent.com/HigherOrderCO/HVM/main/paper/HVM2.typst"}},{"topic":"Bend 對 C++ 迴圈","number":"Bend 在 RTX 4090 加總：1.88 s（作者數字）","baseline":"他機單一 thread C++ 1.7 s，-O3 <80 ms","who":"獨立量測","date":"2024","src":{"t":"Hacker News 40392140","u":"https://news.ycombinator.com/item?id=40392140"}},{"topic":"Bend（LWN 實測）","number":"68 s → 4 thread 25 s → GPU 0.78 s","baseline":"Bend 自己的單一 thread；4 vCPU 的 VM","who":"獨立量測","date":"2025","src":{"t":"LWN（2025-03-05）","u":"https://lwn.net/Articles/1011803/"}},{"topic":"LCS breadth","number":"breadth 2,739（depth 108,142）","baseline":"無限平行機器的理論上限，非實測加速","who":"作者自述","date":"2026","src":{"t":"Tendrils：On Interaction Nets","u":"https://tendrils.co/blog/2026-04-26/on-inets"}},{"topic":"Frostbite 每瓦效能","number":"4.59x；held-out 3.83x；1.15–23.12x","baseline":"未具名 in-order core；pre-silicon","who":"作者自述","date":"2026","src":{"t":"Architect Labs：Frostbite","u":"https://architectlabs.com/blog/frostbite"}},{"topic":"Frostbite 絕對效能","number":"效能約 7.76 倍、功耗約 1.7 倍","baseline":"4 個 tile 對 1 個 in-order core","who":"推算","date":"2026","src":{"t":"Hacker News 50572503","u":"https://news.ycombinator.com/item?id=50572503"}}],"verdict":{"summary_html":"<p>前面把證據分成已經確定的四件和還沒有答案的四件。已經確定的裡面，對判斷最要緊的是兩件：在四個限制下，interaction net 是一個正確、做得出來的 abstract machine；它在現有的 CPU 上跑一般用途的程式，單一 thread 比傳統 compiler 的產出慢 3 倍到 17 倍（四個不同實作各自的數字），要用上很多個 core 或 GPU 才追得回來。還沒有答案的裡面，最要緊的也是兩件：專用硬體能把這個差距補回多少，以及大型的真實程式裡有多少平行度可以用。前一件沒有任何實體晶片的量測；後一件只有小程式和理論上限的數字。<\/p><p>所以現在說它行或說它不行，證據都不夠。這裡的「行」，指的是在它鎖定的那類程式上（支持者點名的是離散最佳化、sparse graph 這類不規則的平行工作），用同樣的面積與功耗做完比現有 CPU 更多的工作。從 1996 年第一個實作起，它都跑在現成的 CPU 與 GPU 上，那條路量到的結果是單一 thread 偏慢。專用硬體這條路到 2024 至 2025 年才有第一個 FPGA 原型（單核心，只跑過三個小程式），還沒有可以拿來比較的量測。2026 年 Architect Labs 與 Tendrils 兩家公司拿到資金做這件事，硬體的數字目前全是公司自己報的。<\/p>","points":[{"short":"理論成立","kind":"fav","text":"理論從 1990 年起有完整文獻，開源實作可以執行。"},{"short":"單一 thread 偏慢","kind":"unfav","text":"1996 到 2025 年的量測方向一致：一般用途的程式慢 3 倍到 17 倍，要靠很多個 core 追回來。"},{"short":"專用硬體補回多少","kind":"open","text":"沒有實體晶片，沒有第三方量測。"},{"short":"真實程式的平行度","kind":"open","text":"只有小程式與理論上限的數字，大型的不規則程式還沒有人發表。"}],"watch":[{"signal":"Frostbite 釋出 RTL 與 ISA","why":"第一份外部可以重跑的 interaction net 硬體設計"},{"signal":"和 out-of-order core 的公開比較","why":"目前的基準是一顆不具名的 in-order core"},{"signal":"實體晶片的量測","why":"有晶片才量得到每瓦的實際效能"},{"signal":"不規則程式上的實測加速","why":"規則的平行工作 GPU 已經能做，這裡要贏的是不規則的工作"},{"signal":"Vine 出現具名的使用者","why":"目前查不到任何 production 使用者"},{"signal":"大型既有程式移植到 Vine","why":"支持者說 AI 會降低移植成本，還沒有人示範"},{"signal":"Tendrils 公布 microarchitecture","why":"公司至今沒有公開 memory、interconnect 與任何 benchmark"}],"study":[{"level":"幾個小時","what":"看懂這個 abstract machine 保證什麼、每次 interaction 做哪些事。前兩頁（觀念、八個測試）就是為這個做的。"},{"level":"幾天到幾週","what":"實際跑 Vine，看 interaction 數與平行度；讀 Frostbite 的能量拆解，自己估上面三個數字。"},{"level":"更深的投入","what":"等 RTL 釋出或有實體晶片的量測再決定，那時才有東西可以驗證。"}],"title":"目前的判斷：理論成立，單一 thread 偏慢，專用硬體與平行度還沒有答案","keys":[{"k":"每次 interaction 的成本","v":"要動幾次 memory、花幾個 cycle。Lamagraph 的原型裡 memory 階段佔多數 cycle。"},{"k":"搬動的成本","v":"工作和資料在 core 之間移動要花多少。Frostbite 自述 network 與 scheduler 佔 26% 的能量。"},{"k":"真實程式的平行度","v":"總工作量除以最長的相依鏈。公開數字從約 12 到 2,739，後者是理論上限。"}],"note_html":"<p class=\"note\">這一站的判斷由作者依前面各站的資料整理，整理時使用了 AI 協助。每一項出處在前面各站。資料截至 2026-11-22。<\/p>","keys_note":"<p class=\"note\">這三個數字目前都沒有公開的實體晶片量測。粗略的門檻（這是本頁的估算，文獻沒有這樣的結論）：專用硬體要贏，「用得上的平行度」乘上「每個 core 相對於一般 CPU 的效率」要大於 1。以軟體量到的差距 3 到 17 倍來看，如果硬體沒有縮小這個差距，平行度只有十幾的程式大約打平，要到上百才有明顯的優勢。硬體能把差距縮小多少，就是還沒有人量過的那個數字。<\/p>","legend":"青＝已確定，對它有利　粉紅＝已確定，對它不利　灰＝還沒有答案"},"model":{"title":"先弄清楚：這個 abstract machine 保證三件事，另外三件事不保證","lead_html":"<p>Interaction net 的程式是一張圖：node 有一個 principal port 和幾個 auxiliary port，兩個 node 用 principal port 相接就是一對 active pair，照規則改寫成別的 node 與 wire。文獻整理出四個限制：每個 node 只有一個 principal port、規則的左邊恰好是一對 active pair、每一對符號最多一條規則、改寫前後對外的 port 不變。在這四個限制下，下面三件事有證明。<\/p>","yes":[{"short":"只動局部","text":"一次改寫只碰相接的兩個 node 和它們的 wire，不需要看圖的其他地方。"},{"short":"一線接兩端","text":"每個 port 恰好接一條 wire，一個值同時間只有一個使用者，所以不必處理共享。"},{"short":"順序無關","text":"不論先改寫哪一對，最後的結果相同，總步數也相同，所以同時改寫幾對是安全的。"}],"no":[{"short":"會停","text":"程式可以永遠改寫下去；順序無關只保證「如果會停，結果唯一」。"},{"short":"平行會變快","text":"能同時做幾對要看這張圖本身；有些 net 每一步只有一對可以做。文獻裡找不到一般性的加速定理。"},{"short":"不會卡住","text":"要保證不 deadlock，得另外加型別上的限制。"}],"src":[{"t":"Lafont，POPL 1990","u":"https://doi.org/10.1145/96709.96718"}],"note_html":"<p class=\"note\">四個限制是後來的文獻（Gay 1991、Mazza 2006、Gimenez 與 Moser 2015）整理的寫法；Lafont 1990 的原文這次沒有取得。node 與 port 怎麼動，可以看另外兩頁：<a href=\"interaction-net-vs-von-neumann.html\" target=\"_blank\" rel=\"noopener\">Interaction Net 對照 von Neumann<\/a>、<a href=\"interaction-net-test-cases.html\" target=\"_blank\" rel=\"noopener\">八個測試<\/a>。<\/p>"},"known":{"title":"已經確定的四件事，和還沒有答案的四件事","lead_html":"<p>判斷之前先把證據分成兩堆。左邊是有證明或有多個來源量過的事：青色的對 interaction net 有利，粉紅色的對它不利，黃色的好壞參半。右邊是到 2026 年 11 月還沒有人量過，或只有公司自己說法的事。右邊這四件，是「換成專用硬體行不行」這個問題裡最主要的未知。<\/p>","yes":[{"short":"理論正確","fav":true,"text":"在四個限制下（見上一站），改寫的順序不影響結果與總步數，有證明。","src":{"t":"Lafont，POPL 1990","u":"https://doi.org/10.1145/96709.96718"}},{"short":"做得出來","fav":true,"text":"1996 年的 BOHM 起，有多個可以執行的實作，現在仍有開源專案在維護。","src":{"t":"Asperti 等，BOHM，JFP 1996","u":"https://www.cambridge.org/core/journals/journal-of-functional-programming/article/bologna-optimal-higherorder-machine/1F2763B0F931680F9B15BDC750BEB343"}},{"short":"單一 thread 偏慢","fav":false,"text":"一般用途的程式（排序、遞迴、數值迴圈這類 benchmark）在 CPU 上單一 thread 比傳統 compiler 慢：BOHM 約 10 倍、Inpla 約 17 倍、HVM1 約 3 倍、HVM2 約 5 倍。這是四個不同實作各自的數字，都是作者自己報的、對自己不利；第三方的量測（LWN、HVM1 issue #60）方向相同。","src":[{"t":"HVM2 論文原始檔","u":"https://raw.githubusercontent.com/HigherOrderCO/HVM/main/paper/HVM2.typst"},{"t":"LWN（2025-03-05）","u":"https://lwn.net/Articles/1011803/"},{"t":"HVM1 issue #60","u":"https://github.com/HigherOrderCO/HVM1/issues/60"}]},{"short":"多個 core 追得回來","fav":"mixed","text":"4 個 core 量到 3 到 4 倍；HVM2 在 16 個 thread 上是自己單一 thread 的 13 倍（作者自述）。加速是真的，但起點低：要用很多個 core 或一張高階 GPU，才追得上傳統做法的一個 thread。一位 Hacker News 使用者量到，Bend 在 RTX 4090 上的時間大約等於沒開最佳化的單一 thread C++。","src":[{"t":"Mackie 與 Sato，ECEASST 73","u":"https://eceasst.org/index.php/eceasst/article/view/2205"},{"t":"Hacker News 40392140","u":"https://news.ycombinator.com/item?id=40392140"}]}],"open":[{"short":"專用硬體補回多少","text":"沒有任何實體晶片的量測。Frostbite 自述每瓦效能是對照組的 4.59 倍；這是 pre-silicon 的數字，對照組是一顆不具名的 in-order core。","src":{"t":"Architect Labs：Frostbite","u":"https://architectlabs.com/blog/frostbite"}},{"short":"真實程式的平行度","text":"平行度是同一時間可以一起做的 interaction 數，用軟體就量得到。公開的數字只有小程式和理論上限：約 12（five-queens）到 2,739（長度 2,000 的 LCS，不限 core 數）。大型、不規則的真實程式還沒有人發表過。","src":[{"t":"Tendrils：On Interaction Nets","u":"https://tendrils.co/blog/2026-04-26/on-inets"},{"t":"Architect Labs：Frostbite","u":"https://architectlabs.com/blog/frostbite"}]},{"short":"搬資料的成本","text":"Frostbite 自述 network 與 scheduler 佔 26% 的能量；Lamagraph 的原型裡 memory 階段佔多數 cycle。沒有第三方數字。","src":[{"t":"Lamagraph issue #77","u":"https://github.com/Lamagraph/interaction-nets-in-fpga/issues/77"},{"t":"XenoSpectrum（2026-11-19）","u":"https://xenospectrum.com/en/frostbite-cpu-design-energy-efficiency/"}]},{"short":"既有軟體怎麼搬","text":"要改用 Vine 這類新語言。支持者說 AI 會降低移植成本，還沒有人示範過大型程式。","src":{"t":"Cloudberry VC：Why We Invested","u":"https://cloudberry.vc/news/why-we-invested-in-tendrils/"}}],"legend":"青＝已確定，對它有利　粉紅＝已確定，對它不利　黃＝已確定，好壞參半　灰＝還沒有答案"},"evidence_title":"三十年來量到的數字：都是在現成硬體上量的","evidence_html":"<p>下面是文獻與公開討論裡最具體的十四筆量測，由舊到新。黃色是作者或公司自己報的，青色是別人量的。前十二筆都是軟體跑在一般 CPU 或 GPU 上，結論一致：一般程式單一 thread 比傳統 compiler 的產出慢。最後兩筆是硬體，都還不是實體晶片的數字。<\/p>","checklist_title":null,"checklist_html":"<p>一個小眾的 abstract machine 要變成實用的處理器，文獻裡常提到的條件整理成十三項，逐項看 interaction net 在 2026 年 11 月的情況。柱子越高，條件越接近滿足。「還沒有答案」表示沒有人量過，或只有公司自己的說法。<\/p>","misconceptions":[{"myth":"confluence 代表平行一定更快","fact":"保證的是結果與總步數相同。加速上限是 net 自身的平行度，sequential net 沒有加速；已審查的文獻中找不到一般性的 speed-up 定理。","src":{"t":"Mackie–Sato 2015","u":"https://ceur-ws.org/Vol-1403/paper5.pdf"}},{"myth":"optimal 就是執行最快","fact":"optimal 只把 Lévy family step 的數目降到最少。一個 family step 的成本可以超過任何 elementary 函數，步數不能當執行時間。","src":{"t":"Asperti 2017 §2","u":"https://arxiv.org/abs/1701.04240"}},{"myth":"Asperti–Mairson 證明 optimal 沒效率","fact":"Asperti 2017 說該結果對效率沒有下結論：成本來自 λ-term 本身必要的複製，任何 evaluator 都得付，至今沒有效率反例。","src":{"t":"Asperti 2017 §2–3","u":"https://arxiv.org/abs/1701.04240"}},{"myth":"Lamping 演算法就是 interaction net","fact":"兩者 1990 年各自發表，1992 年才由 Gonthier–Abadi–Lévy 接上。Mackie 指出有效率的 optimal 實作得離開 interaction net。","src":{"t":"YALE（ICFP 1998）","u":"https://doi.org/10.1145/289423.289434"}},{"myth":"universal 代表有效率","fact":"任何 interaction system 都能翻成 combinators，每條 rule 多付常數倍步數；常數隨來源系統而變，數值得用二元 cell 組成。","src":{"t":"Mazza 2006 thesis §1.4","u":"https://lipn.univ-paris13.fr/~mazza/papers/Thesis-1.0.pdf"}},{"myth":"去掉 oracle 仍能正確化簡所有 λ-term","fact":"不含 oracle 的 abstract algorithm 只證明對 EAL／LAL 可型別化的 term 正確。HVM2 論文自陳 Church 編碼的 2^2 無法正確化簡。","src":{"t":"Baillot–Coppola–Dal Lago","u":"https://arxiv.org/abs/0704.2448"}}],"citations":[{"paper":"Lafont 1990","semantic_scholar":375,"openalex":369,"crossref":151,"asof":"2026-11-21"},{"paper":"Lafont 1997","semantic_scholar":101,"openalex":105,"crossref":58,"asof":"2026-11-21"},{"paper":"Girard 1987","semantic_scholar":1884,"openalex":null,"crossref":2844,"asof":"2026-11-21"},{"paper":"Lamping 1990","semantic_scholar":299,"openalex":null,"crossref":136,"asof":"2026-11-21"},{"paper":"Gonthier–Abadi–Lévy 1992（POPL）","semantic_scholar":267,"openalex":null,"crossref":122,"asof":"2026-11-21"},{"paper":"Mackie 1998（YALE）","semantic_scho
