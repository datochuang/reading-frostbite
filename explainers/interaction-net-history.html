<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interaction Net 三十六年</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 版面：左欄說明、右邊 3D 畫面，兩邊不重疊；窄螢幕時說明在下方。說明可以收起。單一深色世界。 */
:root {
  --bg: #0a1020;
  --panel: #0e1630;
  --line: rgba(160, 180, 220, 0.18);
  --fg: #e9edf7;
  --muted: #a3afcc;
  --accent: #dfe7fb;      /* 介面的重點色：接近白，避免和四條 lane 的顏色混淆 */
  --soft: #9fb4e8;
  --theory: #9085e9;
  --software: #199e70;
  --company: #d6569e;
  --hardware: #c98500;
  --precursor: #a8895a;
  --pro: #58d1c4;
  --con: #ff9aa8;
  --side: 420px;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Menlo", "Consolas", monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.7; overflow: hidden; }
#app { display: flex; width: 100%; height: 100%; }

#side {
  flex: 0 0 var(--side); width: var(--side); min-height: 0; display: flex; flex-direction: column; overflow: hidden;
  background: var(--panel); border-right: 1px solid var(--line);
  padding-left: env(safe-area-inset-left, 0px); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  transition: flex-basis .25s ease, width .25s ease;
}
#side.folded { flex-basis: 0; width: 0; border-right: 0; }
#side .body { flex: 1 1 auto; min-height: 0; overflow: auto; width: var(--side); padding: 18px 20px 16px; -webkit-overflow-scrolling: touch; }
#side .ctl { flex: 0 0 auto; width: var(--side); border-top: 1px solid var(--line); padding: 12px 20px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
#side .ctl:empty { display: none; }
#side .eyebrow { font: 600 11px/1.3 var(--font-mono); letter-spacing: .1em; color: var(--soft); margin-bottom: 10px; }
#side h2 { font-family: var(--font-display); font-weight: 600; font-size: 20px; line-height: 1.4; margin: 0 0 10px; text-wrap: balance; }
#side h3 { font: 700 12.5px/1.3 var(--font-body); letter-spacing: .06em; color: var(--soft); margin: 16px 0 8px; }
#side p { margin: 0 0 10px; color: var(--fg); }
#side p b { color: #fff; font-weight: 700; }
#side p.note { color: var(--muted); font-size: 13px; line-height: 1.6; }
#side ol, #side ul { margin: 0 0 10px; padding-left: 1.3em; }
#side li { margin-bottom: 6px; }
#side a { color: var(--soft); text-underline-offset: 2px; }
.btn { appearance: none; border: 1px solid var(--soft); background: transparent; color: var(--accent); font: 500 14px/1 var(--font-body); padding: 10px 14px; border-radius: 10px; cursor: pointer; }
.btn.primary { background: var(--accent); color: #0a1020; font-weight: 700; border-color: var(--accent); }
.btn:focus-visible, .chip:focus-visible, .ev:focus-visible { outline: 2px solid var(--pro); outline-offset: 2px; }
.readout { font: 600 13px/1.3 var(--font-mono); color: var(--accent); }
.readout.wide { flex: 1 1 100%; font-weight: 500; }
input[type=range] { width: 100%; accent-color: var(--soft); }
.slider { flex: 1 1 100%; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--sw); }
/* 人與單位：可以點的名牌 */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; }
.chip { appearance: none; border: 1px solid var(--line); border-left: 4px solid var(--sw, var(--muted)); background: rgba(160,180,220,.07); color: var(--fg); font: 500 12.5px/1.25 var(--font-body); padding: 6px 9px; border-radius: 6px; cursor: pointer; text-align: left; }
.chip:hover { background: rgba(160,180,220,.16); }
/* 事件清單 */
.evs { list-style: none; padding: 0; margin: 0 0 6px; display: grid; gap: 5px; }
.ev { appearance: none; width: 100%; display: grid; grid-template-columns: 5.6em 1fr; gap: 8px; align-items: baseline; text-align: left; border: 0; border-left: 3px solid var(--sw, var(--muted)); background: rgba(160,180,220,.05); color: var(--fg); font: 400 13.5px/1.45 var(--font-body); padding: 6px 8px; border-radius: 0 6px 6px 0; cursor: pointer; }
.ev:hover, .ev.on { background: rgba(160,180,220,.16); }
.ev time { font: 500 11.5px/1.4 var(--font-mono); color: var(--muted); }
.ev small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.5; margin-top: 2px; }
.tag { display: inline-block; font: 600 10.5px/1 var(--font-body); padding: 3px 5px; border-radius: 4px; margin-left: 6px; vertical-align: 1px; border: 1px solid var(--line); color: var(--muted); }
.tag.self { color: #f1c66b; border-color: rgba(241,198,107,.5); }
.tag.unv { color: var(--con); border-color: rgba(255,154,168,.5); }
/* 觀點 */
.views { list-style: none; padding: 0; margin: 0 0 6px; display: grid; gap: 7px; }
.views li { border-left: 3px solid var(--muted); padding: 2px 0 2px 10px; margin: 0; font-size: 13.5px; line-height: 1.55; }
.views li.pro { border-color: var(--pro); } .views li.con { border-color: var(--con); }
.views b { font-weight: 700; color: #fff; }
.views .st { font: 600 11px/1 var(--font-body); margin-left: 6px; color: var(--muted); }
.views li.pro .st { color: var(--pro); } .views li.con .st { color: var(--con); }
.src { font-size: 12px; color: var(--muted); }
.card-kind { font: 600 11px/1.3 var(--font-mono); letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; margin: 0 0 10px; }
table.t th, table.t td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { color: var(--muted); font-weight: 500; font-size: 12px; }

#stage { flex: 1 1 auto; min-width: 0; position: relative; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#c.dragging { cursor: grabbing; }
#top { position: absolute; top: 0; left: 0; right: 0; z-index: 5; padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 8px 14px; pointer-events: none; flex-wrap: wrap; }
#top .brand { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .04em; color: var(--accent); white-space: nowrap; cursor: pointer; pointer-events: auto; }
#tracks { display: flex; gap: 6px; pointer-events: auto; }
#tracks button { appearance: none; border: 1px solid var(--line); background: rgba(10,16,32,.75); color: var(--muted); font: 600 12.5px/1 var(--font-body); padding: 8px 12px; border-radius: 999px; cursor: pointer; letter-spacing: .04em; }
#tracks button[aria-pressed="true"] { background: var(--fg); color: #0a1020; border-color: var(--fg); }
#tracks button:focus-visible, #dots button:focus-visible, #fold:focus-visible, #nav button:focus-visible { outline: 2px solid var(--pro); outline-offset: 2px; }
#dots { display: flex; gap: 6px; align-items: center; pointer-events: auto; flex-wrap: wrap; }
#dots button { appearance: none; border: 1px solid var(--line); background: rgba(10,16,32,.7); color: var(--muted); font: 500 11.5px/1 var(--font-body); padding: 6px 9px; border-radius: 999px; cursor: pointer; }
#dots button[aria-current="step"] { background: var(--accent); color: #0a1020; border-color: var(--accent); font-weight: 700; }
#dots[hidden] { display: none; }
#fold { margin-left: auto; pointer-events: auto; appearance: none; border: 1px solid var(--line); background: rgba(10,16,32,.75); color: var(--muted); font: 500 12px/1 var(--font-body); padding: 8px 11px; border-radius: 999px; cursor: pointer; }
#nav { position: absolute; z-index: 6; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; }
#nav button { appearance: none; border: 1px solid var(--line); background: rgba(13,20,40,.9); color: var(--fg); font: 500 14px/1 var(--font-body); padding: 12px 16px; border-radius: 10px; cursor: pointer; backdrop-filter: blur(10px); }
#nav button:disabled { opacity: .35; cursor: default; }
#tools { position: absolute; z-index: 6; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(72px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; }
#tools button { appearance: none; width: 40px; height: 40px; border: 1px solid var(--line); background: rgba(13,20,40,.9); color: var(--fg); font: 500 16px/1 var(--font-body); border-radius: 10px; cursor: pointer; }
#tools button:focus-visible { outline: 2px solid var(--pro); outline-offset: 2px; }
#axes { position: absolute; z-index: 4; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); top: calc(92px + env(safe-area-inset-top, 0px)); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; pointer-events: none; }
#axes[hidden] { display: none; }
#axes div { background: rgba(13,20,40,.9); border: 1px solid var(--line); border-top: 3px solid var(--sw); border-radius: 8px; padding: 5px 9px 6px; font-size: 12.5px; line-height: 1.4; min-width: 0; }
#axes b { display: block; color: var(--sw); font-weight: 700; font-size: 12px; letter-spacing: .04em; }
#axes span { color: var(--fg); }
#axes .none span { color: var(--muted); }
#hint { position: absolute; z-index: 4; left: 16px; right: 250px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font-size: 12px; line-height: 1.5; color: var(--muted); pointer-events: none; opacity: .95; }

@media (max-width: 1250px) { :root { --side: 350px; } }
@media (max-width: 760px) {
  #tools { bottom: 62px; right: 12px; }
  #axes { top: 88px; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
  #axes div { font-size: 11.5px; padding: 3px 7px 4px; }
  #app { flex-direction: column-reverse; }
  #side { flex: 0 0 48%; width: 100%; border-right: 0; border-top: 1px solid var(--line); padding-left: 0; padding-top: 0; transition: flex-basis .25s ease; }
  #side.folded { flex-basis: 0; border-top: 0; }
  #side .body, #side .ctl { width: 100%; }
  #side .body { padding: 14px 16px 10px; }
  #side h2 { font-size: 17px; }
  #top { padding-left: 12px; padding-right: 12px; }
  #nav { bottom: 12px; right: 12px; }
  #nav button { padding: 10px 12px; }
  #hint { display: none; }
  #top .brand { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

(function () {

  window.addEventListener('error', e => { document.documentElement.dataset.err = (e.message || 'error') + ' @' + (e.lineno || 0); });
  window.addEventListener('unhandledrejection', e => { document.documentElement.dataset.err = 'rejection: ' + String(e.reason && e.reason.stack || e.reason).slice(0, 300); });
  const RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const QS = new URLSearchParams(location.search);
  const D = {"asof":"2026-11","scale":[[1974,0],[1990,48],[2000,118],[2015,172],[2022,207],[2024,243],[2026,287],[2027,337]],"cover":{"title":"Interaction net 三十六年：四條主軸看它走到哪裡，再判斷它是虛是實","sub":"1990 年的一篇論文，到 2026 年的晶片新創","html":"<p>Interaction net 是 Yves Lafont 在 1990 年提出的 abstract machine：程式是一張 node 接成的圖，計算就是照固定的規則改寫圖上相鄰的一對 node。2026 年有兩家新創想把它做成 CPU，這個 abstract machine 因此被重新注意。<\/p><p><b>歷史<\/b>這條線用四條主軸看它走到哪裡：理論、軟體實作、硬體實作、業界商用。第一站是一張總覽，之後按年代一段一段看。<b>判斷<\/b>這條線把已經確定的事和還沒有答案的事分開，列出量到的數字、同一族的前例，以及兩邊的論點。<\/p><p class=\"note\">拖曳可以轉動視角，點橫條、名牌或事件的小點可以看詳細資料。內容是 2026 年 11 月整理的公開資料，每一筆事件都附出處；公司自己報的數字標「自述」。<\/p>"},"overview":{"title":"逐年播放：從 1974 年走到 2026 年 11 月","html":"<p>場景由近到遠是四條主軸：<b>理論<\/b>、<b>軟體實作<\/b>、<b>硬體實作<\/b>、<b>業界商用<\/b>。硬體後面那一排灰色的是同一族更早的機器（dataflow、graph reduction），當作對照。一條橫條是一個人、一個專案或一家公司，尾端有尖頭表示還在進行。白色的高標是重大事件，一直都在；每條主軸前緣的小點是其他事件，可以點。<\/p><p class=\"note\">按「播放」會沿著時間軸走，事件依序出現在場景和下面的紀錄裡。拉動滑桿可以直接跳到某一年。時間軸越靠近現在畫得越寬。<\/p>"},"board":{"title":"四條主軸看地位：理論早就完成，軟體試過三輪，硬體剛開始，商用還沒有產品","html":"<p>由下到上四層架子是四條主軸。架子上的色塊是那條主軸有人在做的時期，色塊越高表示投入越多；白色名牌是重大事件；最右邊一欄是 2026 年 11 月的狀態。<\/p><p>Interaction net 本身是一個 abstract machine，也可以說是一種程式語言的執行方式，原本和硬體無關。<b>軟體實作<\/b>指在一般 CPU 或 GPU 上真的執行這個 abstract machine 的 runtime 與語言，和 JVM、Haskell 的 runtime 同一類，量到的是真實的執行時間。為它做專用處理器是後來的事，歸在<b>硬體實作<\/b>；用來預估晶片的 simulator 與 pre-silicon 設計也算在這一層。<\/p><p>從這張圖可以直接讀出三件事。下面兩層從 1990 年代就有東西，上面兩層要到 2023 年以後才出現。軟體那一層是三段分開的色塊，三輪之間各隔了幾年。硬體那一層 interaction net 自己的色塊只有最右邊一小段；它左邊灰色的是同一族更早的機器。<\/p>","note_html":"<p class=\"note\">色塊的高低是依事件與參與者的多寡分成的三級，用來比較同一條主軸的不同時期；各層之間的高度不能互相比較。每一項的出處在後面各段與「判斷」那條線。<\/p>","scale":[[1975,0],[2015,46],[2027,92]],"ticks":[1980,1990,2000,2010,2020,2025],"axes":[{"id":"theory","name":"理論","level":"done","status_short":"完成","status_3d":"主要性質都有證明","status":"完成：主要性質都有證明","story":"1990 年提出，1997 年前後主要結果到齊；論文數在 2005–09 年最高，2020 年以後每五年只有一兩篇。","phases":[{"from":1987.0,"to":1998.5,"h":3.2,"label":"成形"},{"from":1998.5,"to":2016.5,"h":1.9,"label":"擴充與分析"},{"from":2016.5,"to":2026.89,"h":0.6,"label":"零星的論文","right":true}],"marks":[{"t":1990.04,"label":"1990 Lafont 提出"},{"t":1997.5,"label":"1997 證明三種 node 就夠"},{"t":1998.0,"label":"1998 步數最少不保證快"}],"sub":"規則與證明"},{"id":"software","name":"軟體實作","level":"partial","status_short":"做得出來，偏慢","status_3d":"一般程式比傳統\ncompiler 慢 3 倍\n到十幾倍","status":"做得出來；一般程式單一 thread 比傳統 compiler 慢 3 倍到十幾倍","story":"三輪：1996 年的 BOHM、2000–2016 年學界的 evaluator、2022–2026 年的 HVM 與 Bend。每一輪都跑得起來，也都量到同樣的速度差距。第三輪的作者在 2026 年 9 月改用別的做法；Vine 等專案還在進行。","phases":[{"from":1996.8,"to":1998.6,"h":1.4,"label":"第一輪","before":true},{"from":2000.0,"to":2016.5,"h":1.4,"label":"第二輪：學界的 evaluator"},{"from":2022.1,"to":2026.71,"h":3.2,"label":"第三輪：HVM、Bend","stop":"作者改用別的做法"}],"marks":[{"t":1996.83,"label":"1996 第一個實作 BOHM"},{"t":2024.38,"label":"2024 Bend 爆紅"},{"t":2026.71,"label":"2026-09 Bend 2 不再用它"}],"sub":"在一般 CPU／GPU\n上執行的 runtime"},{"id":"hardware","name":"硬體實作","level":"early","status_short":"剛開始","status_3d":"只有 FPGA 原型和\npre-silicon 設計，\n沒有實體晶片","status":"剛開始：只有 FPGA 原型和 pre-silicon 設計，沒有實體晶片","story":"整理時沒有找到 2024 年以前的 interaction net 硬體。2024 到 2025 年出現第一個大學的 FPGA 原型，2026 年有第一份 pre-silicon 設計。同一族更早的機器（dataflow、graph reduction、TRIPS）都做出來過，沒有成為通用電腦。","pre":[{"from":1975.0,"to":1994.5,"label":"不算在內：同一族更早的機器（dataflow、graph reduction）"},{"from":2003.0,"to":2012.5,"label":"TRIPS、Reduceron（也是同一族）","row":1}],"phases":[{"from":2024.6,"to":2026.89,"h":1.9,"label":"第一次嘗試","ongoing":true}],"marks":[{"t":2025.44,"label":"2024–25 第一個 FPGA 原型"},{"t":2026.88,"label":"2026-11 Frostbite（pre-silicon）"}],"sub":"專用處理器：\n設計、FPGA、晶片"},{"id":"company","name":"業界商用","level":"none","status_short":"還沒有產品","status_3d":"三家公司拿到資金，\n沒有產品，\n沒有具名客戶","status":"還沒有產品：三家公司拿到資金，沒有產品，沒有具名客戶","story":"2023 年第一家公司拿到資金，2026 年又有兩筆。三家都沒有產品與具名客戶；其中一家在 2026 年改做別的。","phases":[{"from":2023.0,"to":2026.89,"h":1.9,"label":"公司與資金","ongoing":true}],"marks":[{"t":2023.24,"label":"2023 第一筆資金約 $4M"},{"t":2026.86,"label":"2026-11 Tendrils 募得 $30M"}],"sub":"公司、資金、產品"}],"subject":"Interaction net：把程式寫成一張圖、靠改寫相鄰的 node 來計算的 abstract machine，1990 年提出","legend":"色塊＝那條主軸有人在做的時期（尖頭＝還在進行）　白色名牌＝重大事件　灰色＝不算 interaction net，是同一族更早的機器"},"axes":[{"id":"theory","name":"理論","lane":"theory"},{"id":"software","name":"軟體實作","lane":"software"},{"id":"hardware","name":"硬體實作","lane":"hardware"},{"id":"company","name":"業界商用","lane":"company"}],"lanes":[{"id":"theory","name":"理論"},{"id":"software","name":"軟體實作"},{"id":"hardware","name":"硬體實作"},{"id":"precursor","name":"前例：同一族更早的機器（不算 interaction net）","attach":true},{"id":"company","name":"業界商用"}],"actors":[{"id":"levy","name":"Jean-Jacques Lévy","kind":"person","major":false,"role":"optimal reduction 的定義者（1978／1980）。","desc":"Lévy 定義了哪些 redex 屬於同一個 family、可以只化簡一次，並把每個 family 只做一次的化簡稱為 optimal reduction，這給出共享化簡在理論上的最少步數。難處在於有些帶共享的 λ-term 用任何循序的化簡順序都達不到這個步數。這個定義要到 1990 年才由 Lamping 做出實作；1992 年他也是把該演算法改寫成 interaction net 的共同作者。","segs":[{"lane":"theory","from":1978.0,"to":1980.5,"label":"optimal 的定義","ongoing":false}],"src":[{"t":"Lévy 1980","u":"https://pauillac.inria.fr/~levy/pubs/80curry.pdf"},{"t":"Asperti 2017 §2","u":"https://arxiv.org/abs/1701.04240"},{"t":"Δ-Nets §1","u":"https://arxiv.org/abs/2505.20314"}]},{"id":"girard","name":"Jean-Yves Girard","kind":"person","major":false,"role":"linear logic 與 proof net 的提出者，interaction net 的邏輯來源。","desc":"1987 年的 linear logic 把證明畫成 proof net，cut elimination 就是圖改寫。這種改寫只在 multiplicative 片段特別規矩，而該片段能表達的程式太少；Lafont 的 interaction net 要保住同樣的規矩並擴大表達力。1989 年的 Geometry of Interaction 與 Danos–Regnier 的 switching 判準，後來被用來定義無 deadlock 的 net。","segs":[{"lane":"theory","from":1987.0,"to":1989.5,"label":"linear logic、GoI","ongoing":false}],"src":[{"t":"Girard 1987","u":"https://doi.org/10.1016/0304-3975(87)90045-4"},{"t":"Mazza 2006 thesis","u":"https://lipn.univ-paris13.fr/~mazza/papers/Thesis-1.0.pdf"},{"t":"Geometry of Interaction 1","u":"https://doi.org/10.1016/S0049-237X(08)70271-4"},{"t":"Danos–Regnier 1989","u":"https://doi.org/10.1007/BF01622878"}]},{"id":"lafont","name":"Yves Lafont","kind":"person","major":true,"role":"interaction nets（1990）與 interaction combinators（1997）的提出者。","desc":"Lafont 把 multiplicative proof net 推廣成可寫程式的圖改寫系統：每一步只把兩個以 principal port 相連的 agent 換成固定大小的小圖。在四個限制下，化簡順序不影響結果與總步數，所以可以安全地同時改寫多處。1997 年他再提出三種符號、六條 rule 的 interaction combinators，可以翻譯任何 interaction system，每條 rule 多付常數倍步數。這些保證不含終止性；他用來防 deadlock 的型別系統後來被認為過嚴，會擋掉許多安全的程式。","segs":[{"lane":"theory","from":1988.0,"to":1990.0,"label":"linear logic 機器","ongoing":false},{"lane":"theory","from":1990.0,"to":1995.0,"label":"interaction nets","ongoing":false},{"lane":"theory","from":1995.0,"to":1997.5,"label":"三符號 combinators","ongoing":false}],"src":[{"t":"Lafont 1990（POPL）","u":"https://doi.org/10.1145/96709.96718"},{"t":"Lafont 1997","u":"https://doi.org/10.1006/inco.1997.2643"},{"t":"Mazza 2006 thesis（重述定義與定理）","u":"https://lipn.univ-paris13.fr/~mazza/papers/Thesis-1.0.pdf"},{"t":"Lafont 1995","u":"https://doi.org/10.1017/cbo9780511629150.012"}]},{"id":"lamping","name":"John Lamping","kind":"person","major":true,"role":"第一個 Lévy-optimal 化簡演算法的作者（POPL 1990）。","desc":"Lamping 的 sharing graph 用帶編號的 fan 節點表示共用：兩個 fan 相遇時，編號相同就互相抵銷，編號不同就互相複製，另有 delimiter 節點調整編號。這是第一個正確處理共享與解除共享的實作。負責維持編號的 bookkeeping 相當複雜，Asperti 在 2017 年仍說它的成本尚不清楚。","segs":[{"lane":"theory","from":1989.0,"to":1990.5,"label":"optimal 演算法","ongoing":false}],"src":[{"t":"Lamping 1990（POPL）","u":"https://doi.org/10.1145/96709.96711"},{"t":"Asperti 2017 §1、§3","u":"https://arxiv.org/abs/1701.04240"},{"t":"Δ-Nets §1","u":"https://arxiv.org/abs/2505.20314"}]},{"id":"gal","name":"Gonthier–Abadi–Lévy","kind":"group","major":true,"role":"1992 年把 Lamping 的演算法改寫成 interaction net 系統的三位作者。","desc":"POPL 與 LICS 的兩篇論文用帶索引的 bracket 與 croissant 標出共享的範圍，把 Lamping 的演算法寫成一套 interaction net，同時涵蓋 linear logic 與 λ-calculus 的 optimal 共享。Lafont 與 Lamping 在 1990 年各自發表的成果由此接在一起。後續研究指出 bracket 容易累積並造成指數級的額外工作，Asperti 直說 Gonthier 的實作在這一點上是錯的。","segs":[{"lane":"theory","from":1992.0,"to":1992.5,"label":"Lamping 寫成 net","ongoing":false}],"src":[{"t":"POPL 1992","u":"https://doi.org/10.1145/143165.143172"},{"t":"LICS 1992","u":"https://doi.org/10.1109/LICS.1992.185535"},{"t":"Mackie–Pinto 2002 §1","u":"https://repositorium.uminho.pt/bitstreams/f3f5ad5e-9466-4ddf-8869-14d34ea18782/download"},{"t":"Asperti 2017 §3","u":"https://arxiv.org/abs/1701.04240"}]},{"id":"asperti","name":"Andrea Asperti","kind":"person","major":true,"role":"Bologna 的 optimal reduction 主要研究者，BOHM 與成本下界的共同作者。","desc":"他與 Laneve 把 optimal 求值推廣到條件式與遞迴（Interaction Systems），與 Giovannetti、Naletto 做出 BOHM，再與 Mairson 證明 parallel β-step 的成本沒有 elementary 上界，與 Coppola、Martini 證明這個成本出在複製工作本身。2017 年他回顧說，這個下界是 λ-term 本身的性質，對 optimal reduction 的效率沒有下結論，至今也沒有效率上的反例。他認為妨礙實用的是記憶體用量、read-back 成本沒有上界，以及一般函數式程式很少用到高階共享。","segs":[{"lane":"theory","from":1994.0,"to":1997.0,"label":"optimal 理論、BOHM","ongoing":false},{"lane":"theory","from":1997.0,"to":2004.5,"label":"成本下界與專書","ongoing":false},{"lane":"theory","from":2017.0,"to":2017.08,"label":"回顧與 BOHM 移植","ongoing":false}],"src":[{"t":"Asperti 2017","u":"https://arxiv.org/abs/1701.04240"},{"t":"Asperti–Laneve 1994","u":"https://doi.org/10.1017/S0960129500000566"},{"t":"Asperti–Mairson（POPL 1998）","u":"https://doi.org/10.1145/268946.268971"},{"t":"Asperti–Coppola–Martini 2000","u":"https://doi.org/10.1145/325694.325707"}]},{"id":"mairson","name":"Harry Mairson","kind":"person","major":false,"role":"Brandeis 的複雜度研究者，替 optimal reduction 找出成本下界。","desc":"1996 年他與 Lawall 找到一族 λ-term：正常化只要 Θ(n) 時間與 Θ(n) 次 fan interaction，sharing graph 卻要 Ω(2^n) 次 bookkeeping。1997 年他與 Asperti 證明，實作 n 個 parallel β-step 的成本沒有 elementary 上界，任何固定高度的 2 的指數塔都不足以當上界。兩個結果都說明 optimal 的步數不能直接拿來估計執行時間。","segs":[{"lane":"theory","from":1996.0,"to":2001.5,"label":"成本下界","ongoing":false}],"src":[{"t":"Lawall–Mairson 1996","u":"https://doi.org/10.1145/232627.232639"},{"t":"Types-list 公告 1997-05","u":"https://www.engineering.upenn.edu/~sweirich/types/archive/1997-98/msg00086.html"},{"t":"Asperti–Mairson（POPL 1998）","u":"https://doi.org/10.1145/268946.268971"},{"t":"期刊版 2001","u":"https://doi.org/10.1006/inco.2001.2869"}]},{"id":"guerrini","name":"Stefano Guerrini","kind":"person","major":false,"role":"sharing graph 專書的共同作者，後來證明無 bookkeeping 片段的成本上界。","desc":"1998 年他與 Asperti 合寫的專書是 sharing graph 的標準參考，收錄 BOHM 的 benchmark 與 safe node 的處理。2012 到 2017 年他與 Leventis、Solieri 證明：在 elementary 與 light linear logic 這個不需要 bookkeeping 的片段，共享化簡的成本至多是直接做 proof-net 化簡的平方。這個上界只涵蓋該片段，論文也註明先前版本有一個更強的主張尚未解決。","segs":[{"lane":"theory","from":1998.0,"to":1998.5,"label":"sharing graph 專書","ongoing":false},{"lane":"theory","from":2012.0,"to":2017.5,"label":"平方上界","ongoing":false}],"src":[{"t":"Guerrini–Solieri 2017（FSCD）","u":"https://drops.dagstuhl.de/entities/document/10.4230/LIPIcs.FSCD.2017.17"},{"t":"Asperti 2017 §3、§4.2","u":"https://arxiv.org/abs/1701.04240"},{"t":"Asperti–Guerrini 1998（書目）","u":"https://www.semanticscholar.org/paper/0384eacd82ac1fac4b1daa29c98b8f1b12ce328a"}]},{"id":"mackie","name":"Ian Mackie","kind":"person","major":true,"role":"把 interaction net 當成實作技術與程式語言來發展的主要研究者。","desc":"他從 Geometry of Interaction machine（1995）做起，1998 年的 YALE 放棄 optimal 以避開 bookkeeping，之後與 Fernández 提出文字式的 calculus，與 Pinto 把 linear logic 編碼成 combinators，再與 Hassan、Sato 做編譯器與 abstract machine。這個領域的幾個限制是他自己寫下的：有效率的 optimal 實作得離開純 interaction net（1998）、缺一套可用的程式語言（2005）、有些 net 只能循序化簡（2015）。","segs":[{"lane":"theory","from":1995.0,"to":1999.5,"label":"GoI machine、YALE","ongoing":false},{"lane":"theory","from":1999.5,"to":2011.5,"label":"calculus、編譯、語言","ongoing":false},{"lane":"theory","from":2011.5,"to":2016.67,"label":"平行與 in-place","ongoing":false}],"src":[{"t":"YALE（ICFP 1998）","u":"https://doi.org/10.1145/289423.289434"},{"t":"Mackie 2005","u":"https://doi.org/10.1016/j.entcs.2005.02.015"},{"t":"Mackie–Sato 2015","u":"https://ceur-ws.org/Vol-1403/paper5.pdf"},{"t":"Mackie–Pinto 2002","u":"https://repositorium.uminho.pt/bitstreams/f3f5ad5e-9466-4ddf-8869-14d34ea18782/download"}]},{"id":"fernandez","name":"Maribel Fernández","kind":"person","major":false,"role":"研究 interaction net 的型別、終止性與 calculus，後來轉向更一般的 port graph。","desc":"她與 Mackie 研究 term rewriting 與 interaction net 的關係，並在 1999 年提出文字式的 calculus，成為之後描述策略與實作的標準記法。1998 年她給出保證所有 interaction 序列終止的遞迴格式，同時指出一般 intersection 型別的型別系統不可判定。2002 年她與 Khalil 說明只加一個 amb agent 就能編碼 process calculus；之後的 bigraphical nets 與 port graph rewriting 把 interaction net 當成特例。","segs":[{"lane":"theory","from":1996.0,"to":2006.0,"label":"型別、calculus、amb","ongoing":false},{"lane":"theory","from":2006.0,"to":2018.58,"label":"port graph 改寫","ongoing":false}],"src":[{"t":"Fernández–Mackie 1999","u":"https://doi.org/10.1007/10704567_10"},{"t":"Fernández 1998","u":"https://doi.org/10.1017/S0960129598002679"},{"t":"Fernández–Khalil 2002","u":"https://doi.org/10.1016/S1571-0661(05)80363-9"},{"t":"Strategic port graph rewriting","u":"https://arxiv.org/abs/1407.7929"}]},{"id":"pinto","name":"Jorge Sousa Pinto","kind":"person","major":false,"role":"Minho 大學的研究者，最早替 interaction net 化簡設計 abstract machine。","desc":"2000 年他提出循序與並行的 abstract machine，2001 年做出共享記憶體上的平行 evaluator MPINE。2002 年他與 Mackie 把 linear logic 與 λ-calculus 編碼成三個 combinators，步數少於當時其他有限的 interaction net 系統，共享程度則未達 optimal。2003 年的 weak reduction 只化簡到 interface normal form，benchmark 顯示 combinators 版 λ-calculus 的效能大幅改善；2008 年他參與視覺化工具 INblobs。","segs":[{"lane":"theory","from":2000.0,"to":2003.5,"label":"abstract machine","ongoing":false},{"lane":"theory","from":2008.0,"to":2008.5,"label":"INblobs 工具","ongoing":false}],"src":[{"t":"Pinto 2000（FoSSaCS）","u":"https://doi.org/10.1007/3-540-46432-8_18"},{"t":"MPINE（RTA 2001）","u":"https://hdl.handle.net/1822/773"},{"t":"Mackie–Pinto 2002","u":"https://repositorium.uminho.pt/bitstreams/f3f5ad5e-9466-4ddf-8869-14d34ea18782/download"},{"t":"Pinto 2003","u":"https://doi.org/10.1016/S1571-0661(05)82614-3"}]},{"id":"mazza","name":"Damiano Mazza","kind":"person","major":false,"role":"替 interaction combinators 建立語意理論，並界定各種並行擴充的表達力。","desc":"2006 年的博士論文重述 Lafont 的定義與定理，提出有多個 principal port 的 multiport interaction nets，表達力與 π-calculus 相當。他替 symmetric combinators 建立 denotational semantics 與 full abstraction，並說明這個變體只有較弱的 polarized universality。2016 年他證明 differential interaction nets 只能產生 confusion-free 的 event structure，因此無法妥善編碼表達力夠強的 process calculus。","segs":[{"lane":"theory","from":2005.0,"to":2009.5,"label":"multiport 與語意","ongoing":false},{"lane":"theory","from":2009.5,"to":2016.5,"label":"並行擴充的界線","ongoing":false}],"src":[{"t":"Mazza 2006 thesis","u":"https://lipn.univ-paris13.fr/~mazza/papers/Thesis-1.0.pdf"},{"t":"MSCS 2007","u":"https://doi.org/10.1017/S0960129507006135"},{"t":"LMCS 2009","u":"https://arxiv.org/abs/0906.0380"},{"t":"MSCS 2016","u":"https://doi.org/10.1017/S0960129516000402"}]},{"id":"ehrhard_regnier","name":"Ehrhard–Regnier","kind":"group","major":false,"role":"differential interaction nets 的提出者。","desc":"2004 年他們替 differential lambda-calculus 設計 interaction net，並呈現 of course 與 why not 兩個 modality 之間新的對稱。這個系統允許同一個 active pair 有多條 rule，Mazza 把它歸為 multirule 的 non-deterministic 擴充。Ehrhard 與 Laurent 之後用它編碼不含 replication 的 π-calculus；Mazza 在 2016 年證明這條路線的表達力有上限。","segs":[{"lane":"theory","from":2004.0,"to":2010.5,"label":"differential 擴充","ongoing":false}],"src":[{"t":"WoLLIC 2004","u":"https://doi.org/10.1016/j.entcs.2004.06.060"},{"t":"TCS 2006","u":"https://doi.org/10.1016/j.tcs.2006.08.003"},{"t":"Ehrhard–Laurent 2010","u":"https://arxiv.org/abs/1007.0120"},{"t":"Mazza 2006 thesis","u":"https://lipn.univ-paris13.fr/~mazza/papers/Thesis-1.0.pdf"}]},{"id":"sato","name":"Shinya Sato","kind":"person","major":true,"role":"把 interaction net 做成可執行系統的研究者，Inpla 的作者。","desc":"他與 Hassan、Mackie 從 nested pattern matching、編譯器 Pin 與輕量 abstract machine 做起，2015 年與 Mackie 研究哪些 net 適合平行，2016 年提出能自動判斷 rule 可否原地重用兩個 node 的分析。2024 年他把條件式的 nested pattern 做成保守擴充。這些工作處理的限制是 rule 一次只能比對一個參數，以及改寫時能否重用原有的 node。","segs":[{"lane":"theory","from":2008.0,"to":2015.0,"label":"pattern 與編譯器","ongoing":false},{"lane":"theory","from":2015.0,"to":2024.75,"label":"平行與 in-place","ongoing":false}],"src":[{"t":"Hassan–Sato 2008","u":"https://doi.org/10.1016/j.entcs.2008.03.035"},{"t":"Mackie–Sato 2015","u":"https://ceur-ws.org/Vol-1403/paper5.pdf"},{"t":"Mackie–Sato 2016（in-place）","u":"https://arxiv.org/abs/1609.03641"},{"t":"Sato 2024","u":"https://arxiv.org/abs/2410.00540"}]},{"id":"gimenez","name":"Gimenez–Moser","kind":"group","major":false,"role":"提出能認證 interaction net 循序與平行化簡複雜度上界的型別系統。","desc":"Gimenez 與 Moser 的 sized 與 scheduled 型別可以認證循序與平行化簡的時間、空間與 space-time 上界（arXiv 2015，POPL 2016）。論文指出平行化簡的複雜度過去在文獻中多半被略過。它提供的是逐個程式的認證方法；適用於任意 net 的一般性 speed-up 定理，整理時查閱的已審查文獻中沒有找到。","segs":[{"lane":"theory","from":2015.83,"to":2016.5,"label":"複雜度型別","ongoing":false}],"src":[{"t":"Gimenez–Moser（arXiv 2015）","u":"https://arxiv.org/abs/1511.01838"}]},{"id":"deltanets","name":"Δ-Nets（Salvadori）","kind":"project","major":false,"role":"2025 年的 arXiv preprint，宣稱不用 delimiter 就能對完整 λ-calculus 做 optimal 平行化簡。","desc":"Salvadori 用單一種、可有任意多個 auxiliary port 的 replicator agent 取代 fan 與 delimiter，宣稱解決 optimal 平行 λ 化簡的長年難題。論文自述核心必須加上不屬於 interaction 的 canonicalization rule，並需要全域的化簡順序。到 2026-07 已改到第 4 版，沒有發表場所也沒有同儕審查，Semantic Scholar 的引用數是 0，整理時沒有找到獨立的驗證或反駁。","segs":[{"lane":"theory","from":2025.33,"to":2026.5,"label":"optimal 新主張","ongoing":false}],"src":[{"t":"arXiv:2505.20314","u":"https://arxiv.org/abs/2505.20314"},{"t":"danaugrs/deltanets","u":"https://github.com/danaugrs/deltanets"}]},{"id":"bohm","name":"BOHM","kind":"project","major":false,"role":"Bologna Optimal Higher-order Machine：Lamping 式 optimal reduction 的原型實作（1996）。","desc":"BOHM 實作 Lamping 技術的一個變體，來源語言是加了布林、整數與 list 的 λ-calculus，並含 garbage collector。在作者自選的高階函數 benchmark 上，Caml Light 跑不完的題目它在 5 秒內完成；沒有共享可用時它比 Caml Light 慢約 10 倍，數值運算最多慢 50 倍。Asperti 回顧時說主要問題在記憶體用量；程式碼只在 2017 年移植到 C99 一次，之後沒有更新。","segs":[{"lane":"software","from":1996.83,"to":1998.5,"label":"optimal 原型","ongoing":false}],"src":[{"t":"BOHM（JFP 1996）","u":"https://www.cambridge.org/core/journals/journal-of-functional-programming/article/bologna-optimal-higherorder-machine/1F2763B0F931680F9B15BDC750BEB343"},{"t":"asperti/BOHM1.1","u":"https://github.com/asperti/BOHM1.1"},{"t":"Asperti 2017 §4.2","u":"https://arxiv.org/abs/1701.04240"}]},{"id":"yale","name":"YALE 系列","kind":"project","major":false,"role":"Mackie 一系列用 interaction net 編碼 λ-calculus、刻意不求 optimal 的 evaluator。","desc":"1998 年的 YALE 提出新的 interaction net 編碼，放棄 optimal 共享，換來不必做 bookkeeping。2004 年的後續版本與 2011 年的 closed reduction 編碼延續同一方向，後者自稱是同類實作中最有效率的之一。整理後的看法是：已發表的 interaction net λ-evaluator 裡，最有效率的幾個都刻意不求 optimal。","segs":[{"lane":"software","from":1998.0,"to":2011.5,"label":"non-optimal 編碼","ongoing":false}],"src":[{"t":"YALE（ICFP 1998）","u":"https://doi.org/10.1145/289423.289434"},{"t":"Mackie 2004（RTA）","u":"https://doi.org/10.1007/978-3-540-25979-4_11"},{"t":"Closed reduction 2011","u":"https://doi.org/10.1007/978-3-642-24452-0_3"}]},{"id":"amine","name":"AMINE／MPINE","kind":"project","major":false,"role":"Pinto 的 interaction net interpreter（AMINE）與共享記憶體平行版（MPINE）。","desc":"AMINE 是 2000 年 abstract machine 論文對應的 interpreter；MPINE 用 C 與 POSIX threads 在共享記憶體上平行化簡，以 mutex 同步，並把一次 interaction 拆成更細的步驟來減少每次需要的 mutex。2001 年在 2 個處理器上的四個測試，執行時間是循序版的 52.7% 到 110%，其中一個變慢。更多處理器的測試被列為未來工作；Pin 是 Hassan、Mackie、Sato 的另一套系統，兩者常被混淆。","segs":[{"lane":"software","from":2000.0,"to":2001.5,"label":"循序與平行 machine","ongoing":false}],"src":[{"t":"Pinto 2000（FoSSaCS）","u":"https://doi.org/10.1007/3-540-46432-8_18"},{"t":"MPINE（RTA 2001）","u":"https://hdl.handle.net/1822/773"},{"t":"Hassan–Mackie–Sato 2008（歸屬說明）","u":"https://www.user.tu-berlin.de/o.runge/tfs/workshops/gtvmt08/Program/paper_38.pdf"}]},{"id":"pin","name":"Pin／amineLight","kind":"project","major":false,"role":"Hassan、Mackie、Sato 的 interaction net 編譯器（Pin）與輕量 abstract machine（amineLight）。","desc":"2008 年的 Pin 是一個語言加編譯器，把 interaction net 程式編成 abstract machine 執行的檔案，並拿 AMINE 與 SML 當對照。2010 年的輕量 machine 簡化先前的設計，作者稱它比當時其他 interaction net evaluator 明顯更有效率，並據此主張 interaction net 可以當編譯器的中介語言。2015 年的 implementation model 把 calculus、資料結構與低階語言整理成一套。","segs":[{"lane":"software","from":2008.0,"to":2015.33,"label":"編譯器與輕量 machine","ongoing":false}],"src":[{"t":"Hassan–Mackie–Sato 2008","u":"https://www.user.tu-berlin.de/o.runge/tfs/workshops/gtvmt08/Program/paper_38.pdf"},{"t":"ECEASST 29（2010）","u":"http://eceasst.org/index.php/eceasst/article/view/1674"},{"t":"Implementation model 2015","u":"https://arxiv.org/abs/1505.07164"},{"t":"Compilation of Interaction Nets 2009","u":"https://api.crossref.org/works/10.1016/j.entcs.2009.10.018"}]},{"id":"inpla","name":"Inpla","kind":"project","major":false,"role":"Sato 的多執行緒 interaction net interpreter，學術這一脈仍在發版的實作。","desc":"Inpla 以 POSIX threads 讓每個 thread 佔一個 CPU core，支援使用者自訂的 agent 與 rule、內建整數與 reuse annotation。2016 年的論文在 4 核 CPU 上量到的最佳加速約 3 到 4 倍，呼叫密集的算術循序執行時比 SML/NJ 慢 14 到 19 倍（兩組倍數由論文表格換算）。目前版本 0.13.4 於 2026-03-26 釋出，2026 年已有第三方以它的語言方言另寫平行 interpreter。","segs":[{"lane":"software","from":2016.25,"to":2026.89,"label":"多執行緒 interpreter","ongoing":true}],"src":[{"t":"inpla/inpla","u":"https://github.com/inpla/inpla"},{"t":"Mackie–Sato（ECEASST 73）","u":"https://eceasst.org/index.php/eceasst/article/view/2205"},{"t":"In-place graph rewriting","u":"https://arxiv.org/abs/1609.03641"},{"t":"inpla/inpla0.02","u":"https://github.com/inpla/inpla0.02"}]},{"id":"pelcr","name":"PELCR","kind":"project","major":false,"role":"Pedicini 與 Quaglia 的平行／分散式 Lévy-optimal 化簡環境。","desc":"PELCR 在平行或分散式機器上做 Lévy-optimal 化簡，技術是 directed virtual reduction，也就是 Danos–Regnier virtual reduction 的限制版。本頁把它歸在 interaction net 之外的平行 optimal reduction 路線。論文發表於 2000 年（PPDP）與 2007 年（ACM TOCL）；GitHub repo 建於 2015-07，到 2026-11-14 仍有 push。","segs":[{"lane":"software","from":2000.0,"to":2007.5,"label":"平行 optimal 化簡","ongoing":false},{"lane":"software","from":2015.5,"to":2026.89,"label":"GitHub repo 維護","ongoing":true}],"src":[{"t":"Pedicini–Quaglia（TOCL 2007）","u":"https://doi.org/10.1145/1243996.1243997"},{"t":"pis147879/PELCR","u":"https://github.com/pis147879/PELCR"}]},{"id":"hinet","name":"HINet（Kahl）","kind":"project","major":false,"role":"Wolfram Kahl 用 Concurrent Haskell 寫的平行 interaction net 實作。","desc":"HINet 讓每個 function agent 跑在一條 GHC 輕量 thread 上，用來檢驗簡單的高並行實作能否在多核上加速。6 核機器上的加速是 2.3 到 3.1 倍；16 個硬體 thread 的 Xeon 上最高 3.84 倍，超過 9 到 10 核後變慢。單核執行時間約是 Inets 編譯出的執行檔的 10 到 20 倍，作者把多核的限制歸因於同步成本。","segs":[{"lane":"software","from":2014.0,"to":2015.25,"label":"Haskell 平行實作","ongoing":false}],"src":[{"t":"Kahl（arXiv 2015）","u":"https://arxiv.org/abs/1504.02603"}]},{"id":"taelin","name":"Victor Taelin","kind":"person","major":true,"role":"Optlam、HVM、Bend 的作者，Higher Order Company 的創辦人。","desc":"2015 年以 JavaScript 實作 Lamping 的演算法（Optlam），之後做出 Absal、Formality、Interaction Calculus 與 HVM1。2023 年創立 Higher Order Company，2024 年發表 HVM2 與 Bend 1，2026-09 發表 runtime 不含 interaction nets 的 Bend 2。repo 的建立日期與 Hacker News 貼文可以直接查證；各代的效能數字、公司的資金與方向多半出自他本人的貼文與回顧文。","segs":[{"lane":"software","from":2015.58,"to":2018.54,"label":"Optlam、Absal","ongoing":false},{"lane":"software","from":2018.54,"to":2022.01,"label":"Formality、FM-Net","ongoing":false},{"lane":"software","from":2022.01,"to":2023.01,"label":"HVM1、Kindelia","ongoing":false},{"lane":"company","from":2023.01,"to":2026.89,"label":"創立並帶領 HOC","ongoing":true}],"src":[{"t":"VictorTaelin/optlam","u":"https://github.com/VictorTaelin/optlam"},{"t":"HOC: Complete Historical Overview","u":"https://gist.github.com/VictorTaelin/77fd5a2a8a4a07e1da6157ebca3c7cf1"},{"t":"HN 35340472（seed 自述）","u":"https://news.ycombinator.com/item?id=35340472"},{"t":"HN 49746163（Bend 2）","u":"https://news.ycombinator.com/item?id=49746163"}]},{"id":"hoc","name":"Higher Order Company","kind":"company","major":true,"role":"Taelin 於 2023 年創立的公司，開發 HVM、Bend 與 Kind。","desc":"2023 年以約 US$4–4.5M 的 seed 成立；金額出自創辦人自述，兩次說法不同，投資人名單沒有公開，當時的目標包含最終自建硬體。2025 年起募資理由轉為 SupGen 與 program synthesis；2026-09 的 Bend 2 移除 interaction-net runtime，付費產品是以第三方 LLM 為基礎的證明代理 BendAI。","segs":[{"lane":"company","from":2023.01,"to":2025.05,"label":"開發 HVM 與 Bend 1","ongoing":false},{"lane":"company","from":2025.05,"to":2026.71,"label":"SupGen、Bend 2 開發","ongoing":false},{"lane":"company","from":2026.71,"to":2026.89,"label":"轉向 AI 證明代理","ongoing":true,"off":true}],"src":[{"t":"HN 35340472（seed 自述）","u":"https://news.ycombinator.com/item?id=35340472"},{"t":"bend-lang.com/bender","u":"https://bend-lang.com/bender"},{"t":"AkitaOnRails 2026-09-19","u":"https://akitaonrails.com/en/2026/09/19/new-ai-language-just-released-bend-2/"},{"t":"BAAI Hub 彙整（二手）","u":"https://hub.baai.ac.cn/view/59461"}]},{"id":"hvm","name":"HVM（HVM1–HVM4）","kind":"project","major":true,"role":"Taelin 的 interaction-net runtime 系列，2022 到 2026 年共四代。","desc":"HVM1（2022，Rust）採 lazy evaluation 與 Interaction Calculus；HVM2（2024）改為 eager 的 interaction combinators，可編譯到 C 與 CUDA；HVM3（2024-11）與 HVM4（2025-11）回到 lazy 的 Interaction Calculus。作者自報 HVM2 為 400 MIPS（Apple M3 Max 單一 thread）到 74,000 MIPS（RTX 4090），同一篇論文寫明單一 thread 約比 GHC 慢 5 倍。獨立量測有 HVM1 的 issue #60：n=16000 時 HVM1 用 31 秒與 5.9 GB，GHC 用 20 毫秒與 5.6 MB。HVM4 的 README 仍寫 before launch，最後 push 在 2026-05-30。","segs":[{"lane":"software","from":2022.01,"to":2024.1,"label":"HVM1：lazy、Rust","ongoing":false},{"lane":"software","from":2024.1,"to":2024.85,"label":"HVM2：eager、CUDA","ongoing":false},{"lane":"software","from":2024.85,"to":2025.86,"label":"HVM3：回到 lazy","ongoing":false},{"lane":"software","from":2025.86,"to":2026.42,"label":"HVM4：尚未正式發表","ongoing":false}],"src":[{"t":"HigherOrderCO/HVM1","u":"https://github.com/HigherOrderCO/HVM1"},{"t":"HVM2 論文（PDF）","u":"https://raw.githubusercontent.com/HigherOrderCO/HVM2/main/paper/HVM2.pdf"},{"t":"HVM1 issue #60","u":"https://github.com/HigherOrderCO/HVM1/issues/60"},{"t":"HigherOrderCO/HVM4","u":"https://github.com/HigherOrderCO/HVM4"}]},{"id":"bend","name":"Bend（Bend 1／Bend 2）","kind":"project","major":true,"role":"HOC 的高階語言；Bend 1 跑在 HVM2 上，Bend 2 是另一個新語言。","desc":"Bend 1 於 2024-05-17 發表，在 Hacker News 得到 1,041 分；作者在討論串中更正 README 的數字，16 個 core 的實際加速約 12 倍。Bend 2 於 "lane":"hardware","from":2025.05,"to":2025.5,"label":"提出 IPU、找共同創辦人","ongoing":false},{"lane":"company","from":2025.5,"to":2026.89,"label":"Tendrils CEO","ongoing":true}],"src":[{"t":"Interaction Processing Units","u":"http://nilscrm.dev/ipu.html"},{"t":"Cloudberry VC","u":"https://www.cloudberry.vc/news/why-we-invested-in-tendrils/"},{"t":"ETH 實作報告 2025","u":"https://ethz.ch/content/dam/ethz/special-interest/infk/inst-pls/plf-dam/documents/StudentProjects/PracticalWork-reports/2025-Nils-Report.pdf"}]},{"id":"architect","name":"Architect Labs","kind":"company","major":false,"role":"以 AI agent 端到端設計與驗證晶片的新創（Architect Silicon Inc.）。","desc":"2026-06-18 宣布 US$24M seed，由 Kindred Ventures 領投；依公告的時間推斷（本頁推論），這筆資金投的是 AI 設計晶片，interaction net 是五個月後 Frostbite 才公開的方向。同年 8 月發表 AI accelerator Redwood，11 月發表 Frostbite，兩項設計的效能數字都是公司自報。公司稱已與未具名的半導體公司合作，並在 6 月表示設計將於年內 tape-out。","segs":[{"lane":"company","from":2026.47,"to":2026.89,"label":"AI 設計晶片的平台","ongoing":true}],"src":[{"t":"Architect Labs seed 公告","u":"https://architectlabs.com/blog/seed"},{"t":"SiliconANGLE 2026-06-18","u":"https://siliconangle.com/2026/06/18/architect-labs-nabs-24m-speed-chip-design-projects-ai/"},{"t":"The Next Web 2026-06-18","u":"https://thenextweb.com/news/architect-labs-24m-seed-ai-custom-chip-design"},{"t":"VentureBeat 2026-09-18","u":"https://venturebeat.com/infrastructure/inference-chips-are-locked-in-years-before-the-models-theyll-run-architect-labs-says-ai-can-design-them-in-weeks"}]},{"id":"ingpu","name":"ingpu","kind":"project","major":false,"role":"Eugen Jiresch（TU Wien）的 GPU interaction-net evaluator。","desc":"repo 建立於 2011-11-29，論文在 DCM 2012 發表，2014 年收入 EPTCS。作者自己量測的結果是多數情況比 CPU 上的 sequential evaluator 慢：Ackermann(3,7) 為 30.4 秒，amineLight 為 0.4 秒；Fibonacci(20) 為 10.5 秒對 0.03 秒；只有 L-System(27) 接近（1.28 秒對 1.13 秒）。論文指出時間幾乎都花在 communication 與 merge，interaction kernel 本身不到總時間的 0.1%。","segs":[{"lane":"hardware","from":2011.91,"to":2014.25,"label":"GPU evaluator 實驗","ongoing":false}],"src":[{"t":"arXiv:1404.0076","u":"https://arxiv.org/abs/1404.0076"},{"t":"euschn/ingpu","u":"https://github.com/euschn/ingpu"}]},{"id":"hpu","name":"HVM2 CUDA 與 HPU 構想","kind":"project","major":false,"role":"Taelin 的 GPU 路線，以及他在 2024 年提出的 interaction-combinator 處理器構想。","desc":"HVM2 的 CUDA backend 自報在 RTX 4090 上達 74,000 MIPS；論文說把 node buffer 放進每個 block 的 shared memory 之後，throughput 由約 13,000 升到 54,000 MIPS。2024-06 的 Series A gist 把主要產品寫成名為 HPU 的 IC Processor，宣稱比 HVM-CUDA 快 100 倍，文中沒有 FPGA、ASIC 或時程。沒有找到 HOC 實際做過硬體的證據；HVM3 與 HVM4 的 README 都沒有提到 GPU。","segs":[{"lane":"hardware","from":2023.77,"to":2024.38,"label":"HVM 移植到 GPU","ongoing":false},{"lane":"hardware","from":2024.38,"to":2024.82,"label":"CUDA 發表、HPU 構想","ongoing":false}],"src":[{"t":"HVM2 論文（docs.rs）","u":"https://docs.rs/crate/hvm/latest/source/paper/PAPER.pdf"},{"t":"Series A gist 2024-06-27","u":"https://gist.github.com/VictorTaelin/2c727639f9d84269447a1d756c7354c9"},{"t":"HN 37805759","u":"https://news.ycombinator.com/item?id=37805759"},{"t":"HN 35340472（自建硬體）","u":"https://news.ycombinator.com/item?id=35340472"}]},{"id":"lamagraph","name":"Lamagraph","kind":"group","major":false,"role":"聖彼得堡大學的研究群，發表了目前查到最早的 interaction-net FPGA 處理器原型。","desc":"Efim Kubyshkin 2025-06 的學士論文描述一個以 Clash 撰寫、可參數化的單核 interaction-net reducer：最高 7.5 MHz、2,900 個 LUT、351 個 register，並在 Gowin Tang Primer 25K 上以三個小型 λ-term 做功能測試。論文沒有 interactions per second 的數字，結論是這類硬體原則上可行、資源用量小、頻率遠低於對照設計。2026-10 的 issue #77 指出一次 reduction 約需 N+M+K 個記憶體 cycle 加約 6 個固定 cycle。以上都是作者自己的合成與測試結果。","segs":[{"lane":"hardware","from":2024.59,"to":2025.44,"label":"Clash 單核原型開發","ongoing":false},{"lane":"hardware","from":2025.44,"to":2026.89,"label":"原型改進與 bancai","ongoing":true}],"src":[{"t":"Kubyshkin 學士論文","u":"https://se.math.spbu.ru/thesis/texts/Kubyshkin_Efim_Alekseevich_Bachelor_Thesis_2025_text.pdf"},{"t":"Lamagraph/interaction-nets-in-fpga","u":"https://github.com/Lamagraph/interaction-nets-in-fpga"},{"t":"issue #77","u":"https://github.com/Lamagraph/interaction-nets-in-fpga/issues/77"},{"t":"答辯投影片","u":"https://se.math.spbu.ru/thesis/slides/Kubyshkin_Efim_Alekseevich_Bachelor_Thesis_2025_slides.pdf"}]},{"id":"tendrils_chip","name":"Tendrils 處理器（未發表）","kind":"machine","major":false,"role":"Tendrils 規劃中的處理器：數千個小 core，各有 local memory。","desc":"公司表示這個設計不使用共享的可變記憶體，也不需要 cache coherence 協定與 reorder buffer，程式以 Vine 撰寫。2026-04 的文章只給出理想平行度：LCS 2000×2000 共 296,223,905 次 interaction，depth 108,142，breadth 2,739，沒有計入通訊成本。硬體工作的公開跡象只有社群資源清單記載的 Vine「WIP FPGA hardware target」（2025-08），以及徵才頁列出的 SystemVerilog RTL、FPGA prototyping 與 physical design。","segs":[{"lane":"hardware","from":2025.62,"to":2026.89,"label":"FPGA target（WIP）","ongoing":true}],"src":[{"t":"On Interaction Nets","u":"https://tendrils.co/blog/2026-04-26/on-inets"},{"t":"tendrils.co/join","u":"https://tendrils.co/join"},{"t":"interaction-net-resources","u":"https://github.com/marvinborner/interaction-net-resources"},{"t":"Cloudberry VC","u":"https://www.cloudberry.vc/news/why-we-invested-in-tendrils/"}]},{"id":"frostbite","name":"Frostbite","kind":"machine","major":true,"role":"Architect Labs 於 2026-11-18 發表的 interaction-net CPU 設計，仍在 pre-silicon 階段。","desc":"一個 quad 是 2×2 個 tile 加四個 L3 node，在 7 nm 下為 0.792 mm²，final GDS 的 timing 收斂在 500 MHz。公司自報在 25 個以 Vine 撰寫的小型 kernel 上，performance per watt 的幾何平均是一個未具名 dual-issue in-order core 的 4.59 倍；held-out 的 15 個為 3.83 倍，範圍是 1.15 到 23.12 倍。所有數字來自模擬與 layout，沒有 silicon，RTL 與 ISA 尚未釋出，也沒有獨立重現。公司自己的能耗表顯示 on-chip network 與 scheduler 佔非 clock 能耗的 26%。","segs":[{"lane":"hardware","from":2026.88,"to":2026.89,"label":"pre-silicon 設計發表","ongoing":true}],"src":[{"t":"Frostbite 發表文","u":"https://architectlabs.com/blog/frostbite"},{"t":"XenoSpectrum 2026-11-19","u":"https://xenospectrum.com/en/frostbite-cpu-design-energy-efficiency/"},{"t":"explainx.ai 2026-11-19","u":"https://explainx.ai/blog/architect-labs-frostbite-ai-designed-cpu-interaction-nets-4-59x-perf-per-watt-claimed-vs-verified-2026"},{"t":"HN 50572503","u":"https://news.ycombinator.com/item?id=50572503"}]},{"id":"dataflow","name":"Dataflow 機器（MIT 等）","kind":"machine","major":false,"role":"1970 到 1990 年代初的 static 與 tagged-token dataflow 機器。","desc":"Jack Dennis 在 MIT 開創 static dataflow；MIT Tagged-Token Dataflow Architecture 與 Manchester Dataflow Machine 是兩個主要的 dynamic dataflow 計畫。Monsoon 於 1992 年完成，十餘台裝在 Los Alamos 等單位；日本的 EM-4 在 1990-05 有 80 個 processing element 的原型開始運轉。來源歸納的停滯原因是 token 的廣播與配對成本、夠大的 CAM 難以製作，以及指令粒度太細，搬運帶 tag 的結果比許多運算本身還久。out-of-order 處理器後來在小範圍的 window 內採用受限的 dataflow。","segs":[{"lane":"precursor","from":1974,"to":1985.0,"label":"MIT static／TTDA","ongoing":false},{"lane":"precursor","from":1985.0,"to":1992.5,"label":"Monsoon、EM-4","ongoing":false}],"src":[{"t":"Wikipedia：Dataflow architecture","u":"https://en.wikipedia.org/wiki/Dataflow_architecture"},{"t":"Wikipedia：Arvind","u":"https://en.wikipedia.org/wiki/Arvind_(computer_scientist)"},{"t":"IPSJ Computer Museum：EM-4","u":"https://museum.ipsj.or.jp/en/computer/other/0017.html"},{"t":"CACM 1985：Manchester","u":"https://cacm.acm.org/?p=11810"}]},{"id":"graphreduction","name":"Graph reduction 機器","kind":"machine","major":false,"role":"1980 年代為函數式語言製作的 graph reduction 硬體。","desc":"SKIM（Cambridge，1980）是 microcoded 的 combinator reduction 處理器；NORMA（1986）在約 5 MHz 下每秒約 250,000 次 reduction；ALICE（Imperial College）與 GRIP（UCL，1987）是平行機器。GRIP 團隊在 1989 年指出兩個核心問題：把平行度控制在合適的粒度，以及讓常被引用的資料靠近使用它的處理器。Naylor 與 Runciman 的回顧寫道，當時自製機器又慢又貴，取得的效能優勢都被下一代 stock hardware 抵銷。沒有找到 ALICE 與 Flagship 的實測效能數字。","segs":[{"lane":"precursor","from":1980.0,"to":1987.0,"label":"SKIM、NORMA、ALICE","ongoing":false},{"lane":"precursor","from":1987.0,"to":1993.5,"label":"GRIP、Flagship","ongoing":false}],"src":[{"t":"Wikipedia：Graph reduction machine","u":"https://en.wikipedia.org/wiki/Graph_reduction_machine"},{"t":"Naylor & Runciman, JFP 2012","u":"https://doi.org/10.1017/S0956796812000214"},{"t":"Peyton Jones 等，PARLE 1989","u":"https://www.microsoft.com/en-us/research/publication/high-performance-parallel-graph-reduction/"},{"t":"Stewart 等投影片 2018","u":"https://www-users.york.ac.uk/%7Emt540/graceful-ws/slides/Stewart.pdf"}]},{"id":"lispmachine","name":"Lisp machines","kind":"machine","major":false,"role":"1973 年起的 Lisp 專用工作站，廠商有 Symbolics、LMI、TI 與 Xerox。","desc":"MIT Lisp Machine Project 於 1973 年開始，之後有 Symbolics 3600、1987 年的 Ivory VLSI 處理器、LMI Lambda 與 TI Explorer 等產品，到 1988 年總計約 7,000 台。來源歸納的原因是 AI winter 與微電腦革命：較便宜的桌上型 PC 很快就能把 Lisp 程式跑得比 Lisp machine 更快。多數廠商在 1990 年代初結束營業。","segs":[{"lane":"precursor","from":1974,"to":1991.0,"label":"CADR、Symbolics","ongoing":false}],"src":[{"t":"Wikipedia：Lisp machine","u":"https://en.wikipedia.org/wiki/Lisp_machine"}]},{"id":"transputer","name":"Transputer（INMOS）","kind":"machine","major":false,"role":"INMOS 的平行運算晶片系列，搭配 occam 語言。","desc":"1983 年發表、1984 年出貨，晶片內建 RAM 與連到四個鄰居的 serial link，可以互相連接組成平行系統；產品有 T212、T414（1985）與帶 FPU 的 T800（1987）。後繼的 T9000 一直達不到比 T800 快十倍的目標，較快的傳統 RISC CPU 超越了它，INMOS 被賣給 SGS-Thomson。T9000 的 DS-Link 後來成為 IEEE 1355。來源是帶有維護標記的 Wikipedia 條目，細節宜再核對。","segs":[{"lane":"precursor","from":1983.0,"to":1987.5,"label":"T212、T414、T800","ongoing":false}],"src":[{"t":"Wikipedia：Transputer","u":"https://en.wikipedia.org/wiki/Transputer"}]},{"id":"connectionmachine","name":"Connection Machine","kind":"machine","major":false,"role":"Thinking Machines 的大規模平行電腦 CM-1、CM-2 與 CM-5。","desc":"公司成立於 1983 年；CM-1（1986）最多有 65,536 個一位元處理器，採 SIMD 與 hypercube。CM-5（1991）改用 SPARC RISC 處理器組成的 MIMD fat-tree，1,024 個 core 的 CM-5 在 1993 年名列 TOP500 第一。公司在 1994-08 聲請 Chapter 11，硬體部門由 Sun 收購。","segs":[{"lane":"precursor","from":1983.0,"to":1991.0,"label":"CM-1、CM-2（SIMD）","ongoing":false},{"lane":"precursor","from":1991.0,"to":1994.58,"label":"CM-5：改用 SPARC","ongoing":false}],"src":[{"t":"Wikipedia：Connection Machine","u":"https://en.wikipedia.org/wiki/Connection_Machine"},{"t":"Wikipedia：Thinking Machines","u":"https://en.wikipedia.org/wiki/Thinking_Machines_Corporation"}]},{"id":"fifthgen","name":"Fifth Generation（日本）","kind":"project","major":false,"role":"日本 MITI 與 ICOT 在 1982 到 1994 年的國家級平行推論電腦計畫。","desc":"經費略低於 570 億日圓（約 US$3.2 億），目標是每秒 1 億到 10 億次邏輯推論的原型機，當時的工作站約為每秒 10 萬次。計畫做出五台 Parallel Inference Machine 與 KL1 語言。來源的總結是：高度平行的架構最後在速度上被較不專用的硬體超越，例如 Sun 工作站與 Intel x86 機器。","segs":[{"lane":"precursor","from":1982.0,"to":1994.5,"label":"PIM 與 KL1","ongoing":false}],"src":[{"t":"Wikipedia：Fifth Generation","u":"https://en.wikipedia.org/wiki/Fifth_Generation_Computer_Systems"}]},{"id":"tiled","name":"RAW／Tilera（tiled 多核）","kind":"machine","major":false,"role":"從 MIT RAW 開始的 tiled many-core 處理器與它的商業化。","desc":"MIT RAW 計畫始於 1997 年，做出 16 個處理器的 tiled multicore。Tilera 於 2004-10 成立，2007-08 推出 64 核的 TILE64 與 iMesh 網路；2014-07 被 EZchip 以 US$1.3 億收購，之後併入 Mellanox，mesh interconnect 留在 BlueField 產品中。Linux 在 2018-06 移除 TILE 架構。同類的 Adapteva Epiphany-V（1,024 核）在 2016 年 tape-out，創辦人隔年表示它不太可能成為產品。","segs":[{"lane":"precursor","from":1997.0,"to":2004.75,"label":"MIT RAW 計畫","ongoing":false},{"lane":"precursor","from":2004.75,"to":2014.5,"label":"Tilera TILE64","ongoing":false},{"lane":"precursor","from":2014.5,"to":2018.42,"label":"EZchip、Mellanox","ongoing":false}],"src":[{"t":"Wikipedia：Tilera","u":"https://en.wikipedia.org/wiki/Tilera"},{"t":"Wikipedia：Adapteva","u":"https://en.wikipedia.org/wiki/Adapteva"}]},{"id":"trips","name":"TRIPS／EDGE、WaveScalar","kind":"machine","major":false,"role":"2000 年代的顯式 dataflow ISA：UT Austin 的 TRIPS 與 UW 的 WaveScalar。","desc":"TRIPS 做成 130 nm、1.7 億個 transistor 的 ASIC，每個處理器的 window 最多 1,024 個指令。團隊在 ASPLOS 2009 發表實測：編譯過的 SPEC2000 只達 Intel Core 2 的 60%，手工最佳化的簡單 benchmark 則快 3 倍。作者的結論是這個效能水準不支持「EDGE 處理器能在大型複雜應用上勝過業界領先設計」的假設。他們把損失歸到 operand network 的流量、記憶體系統的配置，以及 compiler 形成大 block 的能力。","segs":[{"lane":"precursor","from":2003.0,"to":2009.5,"label":"EDGE／TRIPS 原型","ongoing":false}],"src":[{"t":"Gebhart 等，ASPLOS 2009","u":"https://www.cs.utexas.edu/~skeckler/pubs/asplos09.pdf"},{"t":"Wikipedia：EDGE","u":"https://en.wikipedia.org/wiki/Explicit_data_graph_execution"},{"t":"WaveScalar, MICRO 2003","u":"https://cseweb.ucsd.edu/~swanson/papers/Micro2003WaveScalar.pdf"}]},{"id":"reduceron","name":"Reduceron","kind":"machine","major":false,"role":"York 大學 Naylor 與 Runciman 的 FPGA graph reduction 處理器。","desc":"2012 年的最終設計在 Xilinx Virtex-5 上跑 96 MHz，六條 reduction rule 各在一個 clock cycle 內完成，用掉 90% 的 block RAM。作者實測：平均比 3 GHz Core 2 Duo 上的 GHC -O2 慢 4–5 倍；在同一顆 FPGA 上，比 MicroBlaze 跑自家 F-lite-to-C compiler 的結果快 10–20 倍，對 GHC 等級程式碼的 5–10 倍是推估。作者指出的主要限制是 heap 太小，以及 FPGA 的 clock 頻率偏低。沒有找到獨立重現。","segs":[{"lane":"precursor","from":2008.0,"to":2012.53,"label":"FPGA 上的 reducer","ongoing":false}],"src":[{"t":"Naylor & Runciman, JFP 2012","u":"https://doi.org/10.1017/S0956796812000214"}]},{"id":"heron","name":"Heron／HAFLANG","kind":"machine","major":false,"role":"Heriot-Watt 的 FPGA graph reduction core，自稱是 Reduceron 的「spiritual successor」。","desc":"IFL 2023 的論文（2024-06 出版）自報：約 193 MHz 的 Heron core 在 5 個 benchmark 上的 wall-clock 時間勝過 1.9 GHz 的行動版 Intel i3，每個 cycle 的 reduction 數最多是 GHC 的六倍，約用 2% 的 FPGA 資源。同一組另有硬體 garbage collector Cloaca（2024），以及尚未發表的多核 2D mesh 延伸 Siege。論文內文未能取得，也沒有找到獨立重現；Lamagraph 論文引用的單核數字是 173 MHz，與摘要的 193 MHz 不一致。","segs":[{"lane":"precursor","from":2018.46,"to":2023.0,"label":"延伸 Reduceron 的研究","ongoing":false},{"lane":"precursor","from":2023.0,"to":2026.89,"label":"Heron 與 Siege","ongoing":true}],"src":[{"t":"Heriot-Watt research portal","u":"https://researchportal.hw.ac.uk/en/publications/heron-modern-hardware-graph-reduction/"},{"t":"DOI 10.1145/3652561.3652564","u":"https://doi.org/10.1145/3652561.3652564"},{"t":"haflang/heron","u":"https://github.com/haflang/heron"},{"t":"HAFLANG 專案說明","u":"https://haflang.github.io/about.html"}]}],"links":[{"from":"levy","to":"lamping","t":1990.04,"kind":"builds_on","label":"首次實作 optimal 共享","src":{"t":"Asperti 2017 §1","u":"https://arxiv.org/abs/1701.04240"}},{"from":"girard","to":"lafont","t":1990.04,"kind":"builds_on","label":"推廣 proof net","src":{"t":"Mazza 2006 thesis","u":"https://lipn.univ-paris13.fr/~mazza/papers/Thesis-1.0.pdf"}},{"from":"lamping","to":"gal","t":1992.5,"kind":"builds_on","label":"寫成 interaction net","src":{"t":"Δ-Nets §1","u":"https://arxiv.org/abs/2505.20314"}},{"from":"lafont","to":"gal","t":1992.5,"kind":"uses","label":"採用 Lafont 的形式系統","src":{"t":"POPL 1992","u":"https://doi.org/10.1145/143165.143172"}},{"from":"lamping","to":"bohm","t":1996.83,"kind":"builds_on","label":"實作 Lamping 的變體","src":{"t":"BOHM（JFP 1996）","u":"https://www.cambridge.org/core/journals/journal-of-functional-programming/article/bologna-optimal-higherorder-machine/1F2763B0F931680F9B15BDC750BEB343"}},{"from":"mairson","to":"gal","t":1996.5,"kind":"refutes","label":"bookkeeping 指數下界","src":{"t":"Lawall–Mairson 1996","u":"https://doi.org/10.1145/232627.232639"}},{"from":"gal","to":"yale","t":1998.5,"kind":"cites","label":"避開 bookkeeping 成本","src":{"t":"YALE（ICFP 1998）","u":"https://doi.org/10.1145/289423.289434"}},{"from":"lafont","to":"mazza","t":2006.5,"kind":"extends","label":"multiport 擴充與語意","src":{"t":"Mazza 2006 thesis","u":"https://lipn.univ-paris13.fr/~mazza/papers/Thesis-1.0.pdf"}},{"from":"mazza","to":"ehrhard_regnier","t":2016.5,"kind":"refutes","label":"限於 confusion-free","src":{"t":"Mazza（MSCS 2016）","u":"https://doi.org/10.1017/S0960129516000402"}},{"from":"pin","to":"inpla","t":2016.25,"kind":"builds_on","label":"承接 amineLight","src":{"t":"Mackie–Sato（ECEASST 73）","u":"https://eceasst.org/index.php/eceasst/article/view/2205"}},{"from":"lamping","to":"hvm","t":2024.33,"kind":"uses","label":"不含 oracle 的演算法","src":{"t":"HVM2 paper §13.1","u":"https://raw.githubusercontent.com/HigherOrderCO/HVM/main/paper/HVM2.pdf"}},{"from":"lamping","to":"deltanets","t":2025.33,"kind":"extends","label":"宣稱不需 delimiter","src":{"t":"arXiv:2505.20314","u":"https://arxiv.org/abs/2505.20314"}},{"from":"lamping","to":"taelin","t":2015.579,"kind":"builds_on","label":"Optlam 實作其演算法","src":{"t":"VictorTaelin/optlam","u":"https://github.com/VictorTaelin/optlam"}},{"from":"asperti","to":"taelin","t":2016.794,"k
